<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>無明長夜 · 사무전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 자체 호스팅용 사본 — 구글 폰트가 막힌 환경에서 대신 쓰입니다 */
@font-face{font-family:'IbmPlexSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-07@1.0/IBMPlexSansKR-ExtraLight.woff') format('woff');font-weight:200;font-display:swap}
@font-face{font-family:'IbmPlexSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-07@1.0/IBMPlexSansKR-Light.woff') format('woff');font-weight:300;font-display:swap}
@font-face{font-family:'IbmPlexSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-07@1.0/IBMPlexSansKR-Regular.woff') format('woff');font-weight:normal;font-display:swap}
@font-face{font-family:'IbmPlexSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-07@1.0/IBMPlexSansKR-Text.woff') format('woff');font-weight:450;font-display:swap}
@font-face{font-family:'IbmPlexSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-07@1.0/IBMPlexSansKR-Medium.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'IbmPlexSans';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-07@1.0/IBMPlexSansKR-SemiBold.woff') format('woff');font-weight:600;font-display:swap}
:root{
  --ink:#0a0812; --ink2:#120f1e; --ink3:#1a1630; --ink4:#221d3c;
  --line:#2f2949; --line2:#443b66;
  --tx:#e9e3d6; --dim:#9b93ac; --dim2:#6f6885;
  --gold:#caa548; --gold2:#8e7330;
  --red:#d2563f; --red2:#8e2f27;
  --jade:#4fb3a3; --violet:#9d7fd0; --blue:#6f8fd0;
  --ok:#5fae7a; --warn:#d8a44a;
  --glow:0 0 18px rgba(202,165,72,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--tx);
  font-family:'IBM Plex Sans KR','IbmPlexSans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:14px; line-height:1.72; letter-spacing:-.003em;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1200px 500px at 15% -5%, rgba(157,127,208,.10), transparent 60%),
    radial-gradient(900px 420px at 95% 0%, rgba(210,86,63,.09), transparent 60%);
  background-attachment:fixed;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2c2745;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#3b3460}

/* ── 상단바 ───────────────────────── */
#topbar{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,#120f1ef2,#0d0a18f2);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.tb1{display:flex;align-items:center;gap:14px;padding:9px 16px}
.seal{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold2);
  display:grid;place-items:center;font-size:15px;color:var(--gold);
  background:radial-gradient(circle at 35% 30%,#2a2340,#15111f);box-shadow:var(--glow);flex:none}
.me-name{font-weight:600;font-size:15px;letter-spacing:-.01em}
.me-sub{font-size:11.5px;color:var(--dim)}
.res-wrap{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.res{display:flex;align-items:center;gap:6px;background:#17132a;border:1px solid var(--line);
  border-radius:7px;padding:4px 10px;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.res b{font-weight:600;letter-spacing:0}
.res .ri{font-size:12px;opacity:.95}
.tb2{display:flex;align-items:center;gap:10px;padding:5px 16px 8px;font-size:11.5px;color:var(--dim);
  border-top:1px solid #1d1932;flex-wrap:wrap}
.buffchip{display:inline-flex;align-items:center;gap:5px;background:#17132a;border:1px solid #2b2545;
  border-radius:20px;padding:2px 9px;color:#bdb4cd}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}

/* ── 레이아웃 ─────────────────────── */
#app{display:grid;grid-template-columns:208px minmax(0,1fr) 300px;gap:16px;
  max-width:1560px;margin:0 auto;padding:16px;align-items:start}
@media(max-width:1180px){
  #app{grid-template-columns:184px minmax(0,1fr)}
  #chatcol{grid-column:1/-1;position:static;order:3}
  #chatcol .chat-log{height:300px}
}
@media(max-width:780px){#app{grid-template-columns:1fr;padding:10px} #navcol{order:2} #chatcol{order:3}}

.card{background:linear-gradient(180deg,#141127,#100d1e);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px 16px}
.sect-t{font-size:11px;color:var(--dim2);letter-spacing:.1em;margin:0 0 8px;font-weight:600}

/* 좌측 내비 */
.nav-g{margin-bottom:4px}
.nav-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--tx);
  font-size:13.5px;cursor:pointer;user-select:none}
.nav-h:hover{background:#191430}
.nav-h.on{background:linear-gradient(90deg,#241d42,#1a1630);color:#f1e9d8;box-shadow:inset 2px 0 0 var(--gold)}
.nav-h .ic{width:16px;text-align:center;opacity:.85;font-size:13px}
.nav-h .ar{margin-left:auto;font-size:10px;color:var(--dim2)}
.nav-sub{overflow:hidden;max-height:0;transition:max-height .22s ease;pointer-events:none}
.nav-sub.open{max-height:300px;pointer-events:auto}
.nav-i{padding:7px 12px 7px 38px;font-size:13px;color:var(--dim);border-radius:7px;cursor:pointer}
.nav-i:hover{background:#17132c;color:var(--tx)}
.nav-i.on{color:var(--gold);background:#1b1733}
.nav-i .bd{float:right;font-size:10px;color:var(--red);}

/* 내 정보 패널 */
.mini-stat{display:flex;justify-content:space-between;font-size:12.5px;padding:2.5px 0;color:var(--dim);font-variant-numeric:tabular-nums}
.mini-stat b{color:var(--tx);font-weight:600}
.bar{height:5px;background:#201b38;border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:4px;transition:width .4s}
.bar.hp>i{background:linear-gradient(90deg,#8e2f27,#d2563f)}
.bar.sn>i{background:linear-gradient(90deg,#4a3b86,#9d7fd0)}
.bar.jd>i{background:linear-gradient(90deg,#2f6f66,#4fb3a3)}

/* 공통 UI */
.btn{background:#1e1938;border:1px solid var(--line2);color:var(--tx);border-radius:7px;
  padding:7px 14px;font-size:12.5px;transition:.15s}
.btn:hover{background:#2a2350;border-color:#5b4f87}
.btn.pri{background:linear-gradient(180deg,#b8902f,#8e6c20);border-color:#d8b35a;color:#1a1408;font-weight:600}
.btn.pri:hover{filter:brightness(1.12)}
.btn.red{background:#4a1f1c;border-color:#8e2f27;color:#f0c6bd}
.btn.red:hover{background:#5e2723}
.btn.sm{padding:4px 10px;font-size:11.5px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent}
.tag{display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--dim)}
.tag.g{border-color:var(--gold2);color:var(--gold)}
.tag.r{border-color:var(--red2);color:var(--red)}
.tag.j{border-color:#2f6f66;color:var(--jade)}
.tag.v{border-color:#4a3b86;color:var(--violet)}
h1.page{font-size:25px;margin:2px 0 3px;font-weight:600;letter-spacing:-.01em}
.page-kicker{font-size:11px;color:var(--gold2);letter-spacing:.16em;font-weight:500}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.page-head .rt{margin-left:auto;font-size:12px;color:var(--dim);text-align:right}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.muted{color:var(--dim)}
.tiny{font-size:11.5px}
.hr{height:1px;background:var(--line);margin:12px 0;border:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* 광장 */
.scene{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  height:236px;background:linear-gradient(180deg,#140f24 0%,#1d1430 45%,#241530 100%)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:10px 12px;font-size:11.5px}
.sbadge{background:#0c0916cc;border:1px solid #37304f;border-radius:6px;padding:3px 9px;
  display:inline-flex;gap:8px;align-items:center;color:#cdc5d8}
.story-card{background:linear-gradient(135deg,#2a2033,#1d1728);border:1px solid #4a3b50;border-radius:10px;padding:14px 16px}
.pips{display:flex;gap:4px}
.pips i{width:7px;height:7px;border-radius:50%;background:#4a4160;display:block}
.pips i.on{background:var(--gold)}
.ticker{overflow:hidden}
.ticker-row{display:flex;gap:9px;align-items:center;font-size:12.5px;padding:4px 0}

/* 과목/연구 카드 */
.sub{background:#15122a;border:1px solid var(--line);border-radius:9px;padding:11px 12px;position:relative}
.sub:hover{border-color:var(--line2)}
.sub.active{border-color:var(--gold2);box-shadow:var(--glow)}
.sub h4{margin:0 0 2px;font-size:14px;font-weight:600}
.sub .lv{color:var(--gold);font-weight:600}
.starbtn{position:absolute;right:10px;top:9px;background:none;border:0;color:#4a4160;font-size:14px;padding:0}
.starbtn.on{color:var(--gold)}
.quote{border-left:2px solid var(--line2);padding:4px 0 4px 10px;color:var(--dim);font-size:11.5px;letter-spacing:.01em;line-height:1.8}

/* 테이블 */
table.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid #221d38;text-align:left}
table.t th{color:var(--dim2);font-weight:600;font-size:11px;letter-spacing:.08em}

/* 채팅 */
#chatcol{position:sticky;top:96px}
.chat-tabs{display:flex;gap:2px;padding:7px 8px 0;flex-wrap:wrap}
.ctab{font-size:12px;padding:4px 9px;border-radius:6px 6px 0 0;color:var(--dim);cursor:pointer}
.ctab.on{background:#1e1938;color:var(--gold)}
.chat-log{height:430px;overflow-y:auto;padding:8px 10px;font-size:12px;line-height:1.55;border-top:1px solid var(--line)}
.cmsg{display:flex;gap:6px;padding:3px 0;align-items:flex-start}
.ctime{color:#5a5370;font-size:10.5px;flex:none;width:34px;padding-top:1px}
.cname{font-weight:600;flex:none}
.cbody em{color:#b9aed0;font-style:italic}
.ctitle{font-size:9.5px;border:1px solid #3a3358;border-radius:4px;padding:0 4px;color:#8e86a6;flex:none}
.chat-in{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.chat-in input{flex:1;background:#120f22;border:1px solid var(--line);border-radius:6px;
  color:var(--tx);padding:7px 9px;font-size:12px;outline:none}
.chat-in input:focus{border-color:var(--line2)}

/* 모달 */
.mask{position:fixed;inset:0;background:#05040ad9;z-index:200;display:flex;align-items:center;
  justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.modal{background:linear-gradient(180deg,#171329,#110e20);border:1px solid var(--line2);
  border-radius:12px;width:min(640px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 24px 70px #000a}
.modal.wide{width:min(900px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:17px;font-weight:600}
.mbody{padding:16px 18px}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:7px 12px;font-size:12.5px;color:var(--dim);cursor:pointer;border-radius:7px 7px 0 0}
.tab.on{background:#241d42;color:var(--gold)}
label.f{display:block;font-size:11.5px;color:var(--dim);margin:10px 0 4px;letter-spacing:.06em}
.inp{width:100%;background:#120f22;border:1px solid var(--line);border-radius:7px;color:var(--tx);
  padding:8px 10px;font-size:13px;outline:none}
.inp:focus{border-color:var(--line2)}
textarea.inp{min-height:76px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:#15122a;border:0;color:var(--dim);padding:5px 11px;font-size:11.5px}
.seg button.on{background:#2d2550;color:var(--gold)}

/* 학생증 */
.idcard{border-radius:12px;padding:16px;border:1px solid var(--gold2);position:relative;overflow:hidden;
  background:radial-gradient(500px 220px at 20% 0%,#2e2450,#171028)}
.idcard .av{width:70px;height:70px;border-radius:50%;border:2px solid #d8b35a;display:grid;place-items:center;
  font-size:27px;background:#0f0c1c;flex:none}

/* 토스트 */
#toasts{position:fixed;right:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:8px;max-width:330px}
.toast{background:#1c1734;border:1px solid var(--line2);border-left:3px solid var(--gold);
  border-radius:8px;padding:9px 13px;font-size:12.5px;box-shadow:0 10px 30px #000a;animation:tin .25s}
.toast.bad{border-left-color:var(--red)} .toast.good{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}}

/* 로그 */
.log{background:#0d0b18;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-size:12.5px;max-height:300px;overflow-y:auto;line-height:1.75;font-variant-numeric:tabular-nums}
.log .d{color:var(--gold)} .log .h{color:var(--red)} .log .s{color:var(--jade)}
.log .turn{color:var(--dim2);border-top:1px dashed #2a2444;margin-top:6px;padding-top:5px;font-size:11px;letter-spacing:.1em}

/* 지도 */
.mapwrap{position:relative;background:linear-gradient(160deg,#141026,#0f0c1d);
  border:1px solid var(--line);border-radius:10px;height:380px}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;width:84px}
.node .nd{width:26px;height:26px;margin:0 auto 3px;border-radius:7px;border:1px solid var(--line2);
  background:#1b1733;display:grid;place-items:center;font-size:13px;transition:.15s}
.node:hover .nd{border-color:var(--gold);background:#2b2350}
.node.here .nd{border-color:var(--gold);background:#3a2f5e;box-shadow:var(--glow)}
.node.lock{opacity:.35;cursor:not-allowed}
.node span{font-size:10.5px;color:var(--dim);display:block;line-height:1.3}
.node.here span{color:var(--gold)}

/* 미니게임 */
.booth{background:#15122a;border:1px solid var(--line);border-radius:9px;padding:13px 14px}
.booth h4{margin:0 0 4px;font-size:14.5px}
.target{position:relative;height:150px;background:radial-gradient(circle,#2a2140,#14101f);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:crosshair}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid #4a3f6e}
.shot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--red);
  transform:translate(-50%,-50%);box-shadow:0 0 8px var(--red)}
.fish{font-size:22px;position:absolute;animation:sw 4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="app">
  <div id="navcol"></div>
  <div id="main"></div>
  <div id="chatcol"></div>
</div>
<div id="toasts"></div>
<div id="modalroot"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════
   無明長夜 · 사무전   —  데이터
   ═══════════════════════════════════════════════════ */

const NPC = {
  염라:{n:"염라",h:"閻羅",role:"이사장",c:"#caa548",line:["홍홍홍 ♬","업은 재단하는 것이 아니라 관조하는 것이다.","차 한 잔 하고 가겠느냐."]},
  강시:{n:"강시",h:"僵屍",role:"경비",c:"#6f8fd0",line:["그거뭐야?","통금은 오전 2시다. 늦지 마라.","분실물은 경비실에 있다."]},
  여와:{n:"여와",h:"女媧",role:"매점 관리인",c:"#4fb3a3",line:["앗, 죄송해요! 방금 건 못 본 걸로…","이번 탕약은 배합을 조금 바꿔 봤어요.","파장 반응이 예상보다 격렬해서…"]},
  양귀비:{n:"양귀비",h:"楊貴妃",role:"담임 교사",c:"#d2563f",line:["오늘은 무얼 할 거니.","파장이 조금 흔들리는구나.","거짓말은 금세 티가 난단다."]},
  항아:{n:"항아",h:"姮娥",role:"전투 교관",c:"#9d7fd0",line:["허접~♡","의뢰서 몇 줄로 판단하지 마라.","한 바퀴 더. 아직 숨 붙어 있잖아?"]},
  삼장:{n:"삼장",h:"三藏",role:"보건 교사",c:"#5fae7a",line:["상처부터 보자꾸나.","급할수록 호흡을 고르거라.","만두를 빚는 것도 훌륭한 수행이다."]},
};

/* 5스탯 */
const STATS = [
  {k:"atk", n:"공격",     d:"물리적 피해와 공격 능력"},
  {k:"def", n:"방어",     d:"공격을 막아 내고 견디는 능력"},
  {k:"agi", n:"민첩",     d:"행동 속도와 반사 신경"},
  {k:"men", n:"정신력",   d:"공포와 광기를 견디는 능력"},
  {k:"res", n:"공명 적성", d:"파장을 조율해 공명을 이루는 능력"},
];
const STATCAP = {atk:[10,14,19,24,30,36,44], def:[10,14,19,24,30,36,44], agi:[10,14,19,24,30,36,44],
                 men:[6,9,12,15,19,23,28],   res:[10,14,19,24,30,36,44]};

/* 20과목 — 세계관 수업 목록 */
const SUBJECTS = [

const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const nf=n=>{ n=Math.floor(n);
  if(n>=100000000) return (n/100000000).toFixed(2).replace(/\.?0+$/,"")+"억";
  if(n>=10000) return (n/10000).toFixed(n>=100000?0:2).replace(/\.?0+$/,"")+"만";
  return n.toLocaleString("ko-KR"); };
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function d5(n){ let t=0; for(let i=0;i<n;i++) t+=rnd(1,5); return t; }

function toast(msg,kind=""){
  const d=document.createElement("div"); d.className="toast "+kind; d.innerHTML=msg;
  $("#toasts").appendChild(d);
  setTimeout(()=>{ d.style.transition=".3s"; d.style.opacity=0; d.style.transform="translateX(16px)"; setTimeout(()=>d.remove(),320); },3400);

/* ── 시간 ───────────────────────── */
function cal(){
  const total=Math.floor(S.t);
  const day=Math.floor(total/1440);
  const min=total%1440;
  const y=1024+Math.floor(day/360);
  const m=Math.floor((day%360)/30);
  const dd=(day%30)+1;
  const h=Math.floor(min/60), mm=min%60;
  const ap=h<12?"오전":"오후"; const h12=h%12===0?12:h%12;
  return {y,m:MONTHS[m],dd,h,mm,str:`${ap} ${h12}:${String(mm).padStart(2,"0")}`,
          date:`명계력 ${y}년 ${MONTHS[m]} ${dd}일`, day, min};
}
function hhmm(mins){ mins=Math.max(0,Math.ceil(mins));
  const h=Math.floor(mins/60), m=mins%60;
  return h>0 ? `${h}시간 ${m}분` : `${m}분`; }

/* ── 능력치 / 보정 ───────────────── */
function stat(k){ return S.base[k]+S.bonus[k]; }
function statCap(k){ return STATCAP[k][clamp(S.course-1,0,6)]; }
function hallBonus(k){
  const h=S.hall;
  if(h==="h1"&&k==="men") return 1;
  if(h==="h4"&&k==="res") return 1;
  return 0;
}
function effStat(k){
  let v=stat(k)+hallBonus(k);
  const hpR=S.hp/100, snR=S.sn/100;
  if(k==="atk"||k==="def"){ if(hpR<=.2) v*=.5; else if(hpR<=.5) v*=.8; }
  if(k==="agi"){ if(snR<=.2) v*=.5; else if(snR<=.5) v*=.8; }
  if(k==="atk") v*=1+mod("atkP");
  if(k==="def") v*=1+mod("defP");
  return Math.max(1,Math.round(v));
}
/* 누적 보정치: 연구 + 버프 + 서고 + 날씨 + 숙사 */
function mod(key){
  let v=0;
  const R=S.res;
  if(key==="mana")  v+=R.r1*.06;
  if(key==="study") v+=R.r3*.02;
  if(key==="atkP")  v+=R.r4*.04;
  if(key==="defP")  v+=R.r5*.02;
  if(key==="hpP")   v+=R.r5*.04;
  if(key==="gold")  v+=R.r6*.04;
  if(key==="know")  v+=R.r7*.04;
  if(key==="exp")   v+=R.r8*.04;
  if(key==="loot")  v+=R.r9*.025;
  if(key==="crit")  v+=R.r12*.03;
  if(key==="atkP")  v+=R.r13*.02;
  if(key==="hpP")   v+=R.r13*.02;
  if(key==="know"&&S.hall==="h2") v+=.08;
  if(key==="rest"&&S.hall==="h3") v+=.25;
  S.buffs.forEach(b=>{ if(b.key===key) v+=b.v; });
  if(S.book){ const b=BOOKS.find(x=>x.id===S.book.id); if(b&&b.k===key) v+=b.v; }
  const w=WEATHERS[S.weather]; if(w.k===key) v+=w.v;
  return v;
}
function manaRate(){ return (18 + S.course*8 + S.lvl*0.6)*(1+mod("mana")); }
function maxMana(){ return Math.round(manaRate()*60*(8 + S.res.r2*4)); }
function power(){
  let p=0;
  p+=effStat("atk")*120+effStat("def")*100+effStat("agi")*90+effStat("men")*80+effStat("res")*110;
  let sl=0; SUBJECTS.forEach(s=>sl+=S.sub[s.id].lv); p+=sl*34;
  let rl=0; RESEARCH.forEach(r=>rl+=S.res[r.id]); p+=rl*58;
  p+=S.course*900 + S.lvl*40;
  return Math.round(p*(1+mod("atkP")*.5));
}
function expNeed(){ return Math.round(260*Math.pow(1.11,S.lvl-1)); }
function gainExp(n){
  n=Math.round(n*(1+mod("exp")));
  S.exp+=n;
  let up=0;
  while(S.exp>=expNeed()){ S.exp-=expNeed(); S.lvl++; up++; }
  if(up) toast(`수행 단계 상승 · <b>Lv ${S.lvl}</b>`,"good");
  return n;
}
function gainRin(n){ n=Math.round(n*(1+mod("gold"))); S.rin+=n; return n; }
function gainKnow(n){ n=Math.round(n*(1+mod("know"))); S.know+=n; return n; }

function damageHP(n){ S.hp=Math.max(1,S.hp-n);
  if(S.hp<=1){ toast("체력이 바닥났습니다. 전투 불능 상태로 퇴장합니다.","bad"); } }
function damageSN(n){ S.sn=Math.max(1,S.sn-n);
  if(S.sn<=1){ toast("이성이 바닥났습니다. 정상적인 판단이 어렵습니다.","bad"); } }

/* ── 메인 틱 ─────────────────────── */
let TICK=null;
function startTick(){ if(TICK) clearInterval(TICK); TICK=setInterval(()=>step(3*S.speed),1000); }
function step(mins){
  if(!S.made) return;
  S.t+=mins;

  // 파장 회복
  S.mana=Math.min(maxMana(), S.mana+manaRate()*mins);

  // 체력/이성 회복
  const rr=1+mod("rest");
  S.hp=Math.min(100,S.hp+0.055*mins*rr);
  S.sn=Math.min(100,S.sn+0.045*mins*rr);

  // 버프 감소
  let bch=false;
  S.buffs.forEach(b=>b.left-=mins);
  if(S.buffs.some(b=>b.left<=0)){ S.buffs=S.buffs.filter(b=>b.left>0); bch=true; }
  if(S.book){ S.book.left-=mins; if(S.book.left<=0){ toast(`「${BOOKS.find(b=>b.id===S.book.id).n}」 열람 효과가 끝났습니다.`); S.book=null; } }

  // 날씨
  S.wNext-=mins;
  if(S.wNext<=0){ S.weather=rnd(0,WEATHERS.length-1); S.wNext=rnd(240,480);
    pushNews(`[석탑] 명계의 기상이 「${WEATHERS[S.weather].n}」로 바뀌었습니다.`); }

  // 통행패
  S.passNext-=mins;
  if(S.passNext<=0){ if(S.pass<3){ S.pass++; toast("통행패 1장이 발급되었습니다."); } S.passNext=720; }

  // 수업
  if(S.lesson){
    S.lesson.left-=mins;
    while(S.lesson && S.lesson.left<=0){
      finishPeriod();
    }
  }
  // 수행(연구)
  if(S.study){
    S.study.left-=mins;
    if(S.study.left<=0) finishResearch();
  }
  // 하루 경계
  const d=cal().day;
  if(d!==S.dayStamp){ S.dayStamp=d; onNewDay(); }

  // 자동 소식/채팅
  if(Math.random()<0.012*mins) pushNews(makeNews());
  if(Math.random()<0.010*mins) npcChat();

  renderTop(); renderNav();
  if(["plaza","class","research","exam","quest"].includes(VIEW)) renderMain(true);
  if(Math.random()<0.02) save();
}
function onNewDay(){
  S.fest.basket=0; S.fest.visits=0; S.fest.todayMarks=0;
  S.outing.done={};
  pushNews("[경비] 새 날이 열렸습니다. 문 앞 공양 바구니가 교체되었습니다.");
  toast("새 날입니다. 공양 바구니와 나들이 이야기가 갱신되었습니다.");
}
function pushNews(t){ S.news.unshift({t, time:cal().str}); if(S.news.length>40) S.news.pop(); }
function makeNews(){
  let s=pick(NEWSPOOL);
  return s.replace("{w}",rnd(1,7)).replace("{r}",pick(RANKS).r)
          .replace("{s}",pick(FAKENAMES)).replace("{c}",rnd(1,6)).replace("{g}",pick(["S","A","B"]));
}

/* 오프라인 진행 */
function offline(){
  const el=Math.min(Date.now()-(S.lastReal||Date.now()), 8*3600*1000);
  const mins=Math.floor(el/1000*3);
  if(mins>20){
    const chunk=120; let left=mins;
    while(left>0){ const c=Math.min(chunk,left); step(c); left-=c; }
    toast(`자리를 비운 동안 <b>${hhmm(mins)}</b>이 흘렀습니다.`,"good");
  }
}

let RECENTLINES=[];
function freshLine(pool){
  for(let i=0;i<12;i++){ const l=pick(pool); if(!RECENTLINES.includes(l)){ RECENTLINES.push(l); if(RECENTLINES.length>14)RECENTLINES.shift(); return l; } }
  return pick(pool);
}

  tab=tab||pick(["전체","전체","숙사","계통"]);

    addMsg(tab, n.n, fmtChat(freshLine(n.line)), n.c, n.role);
  }else{

}

      </div></div>`;
  }).join("");

  let list=SUBJECTS.filter(s=>CLASSFILTER==="전체"||STATS.find(x=>x.k===s.st).n===CLASSFILTER);
  if(CLASSSORT==="즐겨찾기") list=[...list].sort((a,b)=>(S.sub[b.id].fav?1:0)-(S.sub[a.id].fav?1:0)||b.id.localeCompare(a.id));
  if(CLASSSORT==="레벨") list=[...list].sort((a,b)=>S.sub[b.id].lv-S.sub[a.id].lv);

  const subCards=list.map(s=>{
    const d=S.sub[s.id], st=STATS.find(x=>x.k===s.st);
    const capped=stat(s.st)>=statCap(s.st);
    const isExam=COURSES[S.course-1].subs.includes(s.id);
    return `<div class="sub ${cur&&cur.id===s.id?"active":""}">
      <button class="starbtn ${d.fav?"on":""}" onclick="favSub('${s.id}')">★</button>
      <h4>${s.n} <span class="lv">${d.lv}</span> ${isExam?'<span class="tag g">시험</span>':""}</h4>
      <div class="tiny muted">${NPC[s.pf].n} 교사 · ${st.n} 계열</div>
      <div class="tiny muted" style="margin:6px 0 2px">진행도 ${d.p}% ${capped?`<span style="color:#d8a44a">· ${st.n} 한계</span>`:`· 완료 시 ${st.n} +1`}</div>
      <div class="bar"><i style="width:${d.p}%"></i></div>
      <div class="tiny muted" style="margin:7px 0 4px">${s.d}</div>
      <div class="quote">${s.q}</div>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" onclick="quickLesson('${s.id}')">1교시 듣기</button>
        <span class="tiny muted" style="margin-left:auto">지식 +${Math.round((20+d.lv*5)*(1+mod("know")))}</span>
      </div></div>`;
  }).join("");

  const curBox=S.lesson?`
    <div class="card pad" style="margin-bottom:12px">
      <div class="spread"><div class="sect-t" style="margin:0">수업 슬롯 1</div>
        <button class="btn sm" onclick="stopLesson()">취소</button></div>
      <div class="spread" style="margin:4px 0 6px">
        <h3 style="margin:0;font-size:17px">${cur.n} <span class="lv" style="color:var(--gold)">Lv ${S.sub[cur.id].lv}</span></h3>
        <span class="tiny muted">${NPC[cur.pf].n} 교사</span></div>
      <div class="bar"><i style="width:${(100-S.lesson.left/S.lesson.total*100).toFixed(1)}%"></i></div>
      <div class="tiny muted" style="margin-top:6px">
        시간표 「${esc(S.plans[S.lesson.planIdx]?S.plans[S.lesson.planIdx].n:"즉석")}」 ${S.lesson.idx+1}/${S.lesson.plan.length}교시 ·
        다음: ${S.lesson.idx+1<S.lesson.plan.length?SUBJECTS.find(x=>x.id===S.lesson.plan[S.lesson.idx+1]).n:"없음"}</div>
      <div class="tiny muted">${hhmm(S.lesson.left)} 남음 · 끝나면 진행도 +25%, 지식 +${Math.round((20+S.sub[cur.id].lv*5)*(1+mod("know")))}</div>
      <div class="tiny" style="color:var(--jade);margin-top:4px">지금 이 강의실 ${rnd(40,90)}명 · 함께 시작한 학생 ${rnd(40,90)}명, 경험치 +5%</div>
    </div>`:"";

  return head("일곱 과목, 일곱 해","📖 강의실", `전공 수업 효율 <b style="color:var(--gold)">×${eff.toFixed(2)}</b><br><span class="tiny">경험치 · 지식 획득량</span>`)+`
  ${buffStrip()}
  <div class="card pad" style="margin-bottom:12px">
    <div class="spread"><div class="sect-t" style="margin:0">시간표</div>
      <button class="btn sm pri" onclick="examPlan()">${S.course}과정 시험 과목으로 짜기</button></div>
    <div class="tiny muted" style="margin:6px 0 10px">교시를 최대 4시간까지 짜 두고 「시간표 듣기」로 차례로 이어 듣습니다.
    <b style="color:var(--gold)">승급 시험은 지정 과목 세 개의 레벨로 채점</b>하므로, 과정이 바뀌면 시간표도 바꾸는 편이 좋습니다.</div>
    <div class="grid g3">${planCards}</div>
  </div>
  ${curBox}
  <div class="row" style="margin-bottom:10px">
    <span class="tiny muted">과목 정렬</span>
    <span class="seg">${["즐겨찾기","레벨","기본"].map(x=>`<button class="${CLASSSORT===x?"on":""}" onclick="setCS('${x}')">${x}</button>`).join("")}</span>
    <span class="tiny muted" style="margin-left:12px">필터</span>
    <span class="seg">${["전체",...STATS.map(s=>s.n)].map(x=>`<button class="${CLASSFILTER===x?"on":""}" onclick="setCF('${x}')">${x}</button>`).join("")}</span>
  </div>
  <div class="grid g4">${subCards}</div>`;
};
function examPlan(){
  const c=COURSES[S.course-1];
  const short=c.subs.filter(id=>S.sub[id].lv<c.need).sort((a,b)=>S.sub[a].lv-S.sub[b].lv);
  const list=short.length?[...short,...c.subs].slice(0,4):[...c.subs,c.subs[0]];
  S.plans[0]={n:`${S.course}과정 시험 준비`, list};
  toast(`시간표 1을 ${S.course}과정 시험 과목으로 바꿨습니다.`,"good");
  renderMain(); save();
}
function setCS(v){CLASSSORT=v;renderMain()} function setCF(v){CLASSFILTER=v;renderMain()}
function favSub(id){ S.sub[id].fav=!S.sub[id].fav; renderMain(); save(); }
function startLesson(i){
  const p=S.plans[i]; if(!p) return;
  S.lesson={plan:[...p.list], idx:0, left:60, total:60, planIdx:i};
  toast(`「${p.n}」 수업을 시작합니다.`); renderMain(); renderTop();
}
function quickLesson(id){
  S.lesson={plan:[id], idx:0, left:60, total:60, planIdx:-1};
  toast(`${SUBJECTS.find(s=>s.id===id).n} 1교시를 시작합니다.`); renderMain();
}
function stopLesson(){ S.lesson=null; renderMain(); renderTop(); }
function finishPeriod(){
  const L=S.lesson; const id=L.plan[L.idx]; const s=SUBJECTS.find(x=>x.id===id); const d=S.sub[id];
  d.p+=25;
  gainKnow(20+d.lv*5);
  gainExp(28+d.lv*6+S.course*10);
  addMark(5);
  if(d.p>=100){
    d.p=0; d.lv++;
    if(stat(s.st)<statCap(s.st)){ S.bonus[s.st]++; toast(`「${s.n}」 수료 · <b>${STATS.find(x=>x.k===s.st).n} +1</b>`,"good"); }
    else toast(`「${s.n}」 Lv ${d.lv} · ${STATS.find(x=>x.k===s.st).n}은(는) 이미 한계입니다.`);
  }
  const extra=L.left; // 음수 캐리
  if(L.idx+1<L.plan.length){ L.idx++; L.left=60+extra; L.total=60; }
  else { S.lesson=null; toast("시간표를 모두 마쳤습니다."); }
}
function editPlan(i){
  const p=S.plans[i]||{n:`시간표 ${i+1}`, list:["s17"]};
  let list=[...p.list];
  const draw=()=>{
    const opts=SUBJECTS.map(s=>`<option value="${s.id}">${s.n} (Lv ${S.sub[s.id].lv})</option>`).join("");
    return `
    <label class="f">시간표 이름</label>
    <input class="inp" id="pn" value="${esc(p.n)}" maxlength="12">
    <label class="f">교시 (최대 4시간)</label>
    <div id="rows">${list.map((id,k)=>`
      <div class="row" style="margin-bottom:6px">
        <span class="tiny muted" style="width:46px">${k+1}교시</span>
        <select class="inp" style="flex:1" onchange="PLANTMP[${k}]=this.value">${opts.replace(`value="${id}"`,`value="${id}" selected`)}</select>
        <button class="btn sm red" onclick="planDel(${k})">삭제</button>
      </div>`).join("")}</div>
    ${list.length<4?`<button class="btn sm" onclick="planAdd()">+ 교시 추가</button>`:""}
    <div class="row" style="margin-top:14px">
      <button class="btn pri" onclick="planSave(${i})">저장</button>
      ${S.plans[i]?`<button class="btn red" onclick="planClear(${i})">시간표 비우기</button>`:""}
      <button class="btn" onclick="closeModal()">닫기</button></div>`;
  };
  window.PLANTMP=list;
  window.planAdd=()=>{ PLANTMP.push("s17"); list=PLANTMP; modal(`시간표 ${i+1} 수정`,draw()); };
  window.planDel=k=>{ PLANTMP.splice(k,1); if(!PLANTMP.length)PLANTMP.push("s17"); list=PLANTMP; modal(`시간표 ${i+1} 수정`,draw()); };
  window.planSave=idx=>{ const n=$("#pn").value.trim()||`시간표 ${idx+1}`;
    S.plans[idx]={n, list:[...PLANTMP]}; closeModal(); renderMain(); save(); toast("시간표를 저장했습니다."); };
  window.planClear=idx=>{ S.plans[idx]=null; closeModal(); renderMain(); save(); };
  modal(`시간표 ${i+1} 수정`, draw());
}
function buffStrip(){
  const items=[];
  S.buffs.filter(b=>!b.hide).forEach(b=>items.push(`<span class="buffchip">${b.e||"◉"} ${esc(b.n)} <span class="muted">${hhmm(b.left)}</span></span>`));
  if(S.book) items.push(`<span class="buffchip">📜 ${BOOKS.find(b=>b.id===S.book.id).n} <span class="muted">${hhmm(S.book.left)}</span></span>`);
  if(!items.length) return "";
  return `<div class="card pad" style="margin-bottom:12px;padding:9px 14px"><div class="row">${items.join("")}</div></div>`;
}

  const curBox=cur?`
    <div class="card pad" style="margin-bottom:14px">
      <div class="spread"><div><span class="tag j">수행</span> <b>${cur.n} ${S.res[cur.id]+1}단계</b></div>
        <div class="tiny muted">${hhmm(S.study.left)} 남음</div></div>

    <div class="spread"><div class="sect-t" style="margin:0">죄업 기록 서고</div>
      <span class="tiny muted">열람 비용 지식 <b style="color:var(--jade)">${nf(bookCost())}</b> · 보유 ${nf(S.know)}</span></div>
    <div class="tiny muted" style="margin:4px 0 10px">지식을 들여 고서를 펼치면 3시간 동안 효과가 적용됩니다. 같은 책을 다시 펼치면 시간이 이어집니다(최대 9시간).</div>
    ${S.book?`<div class="row" style="margin-bottom:10px"><span class="tag g">열람 중</span>
      <b>${BOOKS.find(b=>b.id===S.book.id).n}</b> · ${BOOKS.find(b=>b.id===S.book.id).e}
      <span class="tiny muted" style="margin-left:auto">${hhmm(S.book.left)}</span></div>`:""}
    <div class="grid g2">
      ${BOOKS.map(b=>{const on=S.book&&S.book.id===b.id;
        return `<div class="spread" style="background:#15122a;border:1px solid ${on?"var(--gold2)":"var(--line)"};border-radius:7px;padding:7px 11px">
        <div><b style="font-size:13px">${b.n}</b> <span class="tiny muted">${b.e}</span></div>
        <button class="btn sm ${on?"pri":""}" onclick="readBook('${b.id}')">${on?"이어 읽기":"바꿔 펼치기"}</button></div>`}).join("")}
    </div></div>`;

  const cards=RESEARCH.map(r=>{

    const tm=Math.round(r.t*Math.pow(1.11,lv));
    const busy=!!S.study;
    return `<div class="sub ${locked?"":""}" style="${locked?"opacity:.45":""}">
      <div class="spread"><h4 style="margin:0">${r.n}</h4><span class="tiny muted">${lv} / ${r.max===999?"∞":r.max}</span></div>
      <div class="tiny muted" style="margin:5px 0 2px">${r.e}</div>
      <div class="tiny" style="color:var(--jade)">지금 받는 효과 · ${effText(r,lv)}</div>

function effText(r,lv){
  if(lv===0) return "없음";
  const m={r1:["파장 재생",6],r2:["파장 한도","+"+lv*3+"시간분"],r3:["수업 효율",2],r4:["공격력",4],r5:["생명력",4],
    r6:["륜 획득",4],r7:["지식 획득",4],r8:["경험치",4],r9:["전리품 확률",2.5],r10:["공명 배율","+"+(lv*.1).toFixed(1)],
    r11:["가방 칸","+"+lv*5],r12:["강화 성공률",3],r13:["공격·생명력",2]}[r.id];
  if(typeof m[1]==="string") return `${m[0]} ${m[1]}`;
  return `${m[0]} +${(m[1]*lv).toFixed(m[1]%1?1:0)}%`;
}
function cutCost(k){ return k==="mana"?Math.round(manaRate()*72):Math.round(960+S.course*120); }
function startStudy(id){
  if(S.study){ toast("이미 수행 중입니다.","bad"); return; }
  const r=RESEARCH.find(x=>x.id===id), lv=S.res[id];
  if(r.req&&S.course<r.req){ toast(`${r.req}과정부터 가능합니다.`,"bad"); return; }
  if(lv>=r.max){ toast("이미 완료했습니다.","bad"); return; }
  const cm=Math.round(1800*Math.pow(1.115,lv)*r.mana), ck=Math.round(70*Math.pow(1.115,lv)*r.know);
  if(S.mana<cm){ toast("파장이 부족합니다.","bad"); return; }
  if(S.know<ck){ toast("지식이 부족합니다.","bad"); return; }
  S.mana-=cm; S.know-=ck;
  const tm=Math.round(r.t*Math.pow(1.11,lv));
  S.study={id, left:tm, total:tm};
  toast(`${r.n} ${lv+1}단계 수행을 시작했습니다.`); renderMain(); renderTop(); save();
}
function cutStudy(k){
  if(!S.study) return; const c=cutCost(k);
  if(k==="mana"&&S.mana<c){ toast("파장이 부족합니다.","bad"); return; }
  if(k==="know"&&S.know<c){ toast("지식이 부족합니다.","bad"); return; }
  if(k==="mana") S.mana-=c; else S.know-=c;
  S.study.left=Math.max(0,S.study.left-60);
  if(S.study.left<=0) finishResearch();
  renderMain(); renderTop();
}
function cancelStudy(){ S.study=null; toast("수행을 중단했습니다."); renderMain(); }
function finishResearch(){
  const r=RESEARCH.find(x=>x.id===S.study.id);
  S.res[r.id]++; S.study=null;
  addMark(12); gainExp(120+S.course*40);
  toast(`<b>${r.n} ${S.res[r.id]}단계</b> 수행을 마쳤습니다.`,"good");
  pushNews(`[서가] ${S.name} 학생이 ${r.n} ${S.res[r.id]}단계를 마쳤습니다.`);
  save();
}
function bookCost(){ return Math.round(1200+S.lvl*140+S.course*600); }
function readBook(id){
  const c=bookCost();
  if(S.book&&S.book.id===id){
    if(S.know<c){ toast("지식이 부족합니다.","bad"); return; }
    S.know-=c; S.book.left=Math.min(540,S.book.left+180); toast("열람 시간을 이었습니다.");
  }else{
    if(S.know<c){ toast("지식이 부족합니다.","bad"); return; }
    S.know-=c; S.book={id,left:180};
    toast(`「${BOOKS.find(b=>b.id===id).n}」를 펼쳤습니다.`);
  }
  renderMain(); renderTop(); save();
}
function addMark(n){
  if(S.fest.todayMarks>=100) return;
  const add=Math.min(n, 100-S.fest.todayMarks);
  S.fest.todayMarks+=add; S.fest.marks+=add; S.fest.total+=add;
}

/* ═══════════════════════════════════════════════════
   전투 판정 — 세계관 규칙 (D5)
   공격 판정: 공격 스탯 D5 + 5  /  방어 판정: 방어 스탯 D5 + 5
   회피: 양측 민첩 D5 비교 (대련은 공격자 민첩+1)
   ═══════════════════════════════════════════════════ */
function mkFighter(n,st,hp,c){ return {n, atk:st.atk, def:st.def, agi:st.agi, men:st.men, res:st.res, hp, max:hp, c:c||"#b9b1c6"}; }
function meFighter(tempHP){
  return mkFighter(S.name,{atk:effStat("atk"),def:effStat("def"),agi:effStat("agi"),men:effStat("men"),res:effStat("res")},
    tempHP||Math.round(S.hp*(1+mod("hpP"))*1.6+60), S.color);
}
function enemyFor(stage,boss){
  const k=stage;
  const st={atk:Math.max(1,Math.round(1.6+k*.32)), def:Math.max(1,Math.round(1.2+k*.28)),
            agi:Math.max(1,Math.round(1.4+k*.26)), men:3, res:2};
  const names=["업귀 잔해","폭주한 마무기","영혼 밀매상","개조 의체 괴한","죄업에 잠식된 악인","마녀의 사역물","업귀"];
  const hp=Math.round(70+k*26)*(boss?2.4:1);
  const f=mkFighter(boss?`【${pick(["무명","잿빛","검은 손","홍월"])}】 ${pick(names)}`:pick(names), st, Math.round(hp), "#d2563f");
  f.boss=!!boss; return f;
}
function resolveAttack(A,D,log,opts={}){
  const bonusEvade=opts.duel?1:0;
  const av=d5(A.atk)+5;
  // 민첩이 방어보다 뚜렷하게 높으면 회피를, 아니면 방어를 고른다 (비슷하면 섞는다)
  const gap=D.agi-D.def;
  const wantEvade = gap>1 ? Math.random()<.8 : gap<-1 ? Math.random()<.2 : Math.random()<.5;
  let line=`<span class="d">${esc(A.n)}</span> 공격 판정 <b>${av}</b>`;
  if(wantEvade){
    let ar,dr,guard=0;
    do{ ar=d5(A.agi+bonusEvade); dr=d5(D.agi); guard++; }while(ar===dr && guard<8); // 동점은 재판정
    if(dr>ar){ log.push(line+` → ${esc(D.n)} 회피 판정 ${dr} vs ${ar} · <span class="s">완전 회피</span>`); return 0; }
    D.hp=Math.max(0,D.hp-av);
    log.push(line+` → 회피 실패 (${dr} vs ${ar}) · <span class="h">체력 −${av}</span>`);
    return av;
  }else{
    const dv=d5(D.def)+5;
    const dmg=Math.max(0,av-dv);
    D.hp=Math.max(0,D.hp-dmg);
    log.push(line+` → ${esc(D.n)} 방어 판정 <b>${dv}</b> · ${dmg>0?`<span class="h">체력 −${dmg}</span>`:`<span class="s">완전 방어</span>`}`);
    return dmg;
  }
}
function simBattle(me,allies,foes,maxTurn,opts={}){
  const log=[]; let turn=0;
  const order=[me,...allies,...foes].sort((a,b)=>d5(b.agi)-d5(a.agi));
  log.push(`<span class="turn">전투 개시 · 선공 ${esc(order[0].n)}</span>`);
  while(turn<maxTurn){
    turn++;
    log.push(`<span class="turn">${turn}턴</span>`);
    for(const u of order){
      if(u.hp<=0) continue;
      const foe = foes.includes(u);
      const targets = foe ? [me,...allies].filter(x=>x.hp>0) : foes.filter(x=>x.hp>0);
      if(!targets.length) break;
      resolveAttack(u, pick(targets), log, opts);
    }
    if(foes.every(f=>f.hp<=0)){ log.push(`<span class="s">■ 적을 모두 제압했습니다.</span>`); return {win:true,turn,log}; }
    if(me.hp<=0){ log.push(`<span class="h">■ 전투 불능. 현장에서 퇴장합니다.</span>`); return {win:false,turn,log}; }
  }
  log.push(`<span class="turn">제한 턴 종료 · 철수</span>`);
  return {win:false,turn,log,timeout:true};
}

function questAt(stage){
  const seed=stage*7919;
  const r=(n)=>Math.floor((Math.sin(seed*n)*10000)%1000+1000)%1000;
  const rank=RANKS[clamp(Math.floor((stage-1)/30),0,4)];
  const ward=WARDS[r(3)%7];
  const t=`${QT_A[r(1)%QT_A.length]} ${QT_B[r(2)%QT_B.length]}`;
  const dur=30+((r(4)%7)*10);
  const foes=1+Math.floor(stage/8)+ (rank.r==="Ⅴ"?1:0);
  return {stage, rank, ward, t, dur, foes, no:`${1024}-${String(stage).padStart(3,"0")}`};
}

function questReward(q){
  const m=q.rank.mul, k=q.stage;
  return {rin:Math.round((120+k*48)*m), exp:Math.round((90+k*34)*m), know:Math.round((18+k*7)*m),
          sari:(q.rank.r==="Ⅳ"&&Math.random()<.3)||q.rank.r==="Ⅴ"?1:0};
}
function makeRoom(st){ S.quests.room={stage:st,pos:"후열",party:[]}; renderMain(); toast("함께 의뢰 방을 열었습니다. 다른 학생이 들어오기를 기다립니다."); }

function inviteParty(){

  const pool=[...S.friends.map(f=>f.n), ...FAKENAMES];

function inviteTeacher(){
  const r=S.quests.room; if(r.party.length>=3){ toast("자리가 다 찼습니다.","bad"); return; }
  if(S.rin<600){ toast("륜이 부족합니다.","bad"); return; }
  S.rin-=600;
  const t=pick(["항아","삼장","강시","양귀비"]);
  r.party.push({n:NPC[t].n, pos:"선봉", teacher:true, lv:9});
  renderMain(); renderTop(); toast(`${NPC[t].n} 교사가 동행합니다.`,"good");
}
function runQuest(stage,party){
  const q=questAt(stage);
  if(S.hp<=10){ toast("체력이 너무 낮습니다. 보건실에서 회복하세요.","bad"); return; }
  const room=party?S.quests.room:null;
  const pos=room?room.pos:"후열";
  const me=meFighter();
  if(pos==="선봉") me.atk=Math.round(me.atk*1.1);
  const allies=(room?room.party:[]).map(p=>mkFighter(p.n,
    {atk:Math.max(1,Math.round((p.teacher?7:2)+p.lv*.6)), def:Math.max(1,Math.round((p.teacher?6:2)+p.lv*.5)),
     agi:Math.max(1,Math.round((p.teacher?6:2)+p.lv*.5)), men:3,res:3},
    Math.round(120+p.lv*40), p.teacher?"#caa548":"#9db8c9"));
  const foes=Array.from({length:q.foes},(_,i)=>enemyFor(stage, i===0&&q.rank.r==="Ⅴ"));
  const res=simBattle(me,allies,foes,10);

  S.t+=q.dur;
  let hpL=rnd(q.rank.hp[0],q.rank.hp[1]), snL=rnd(q.rank.sn[0],q.rank.sn[1]);
  if(pos==="선봉") hpL=Math.round(hpL*1.1);
  if(pos==="지원"){ hpL=Math.round(hpL*.8); snL=Math.round(snL*.8); }
  if(S.ward){ hpL=Math.round(hpL*.5); snL=Math.round(snL*.5); S.ward=false; }
  if(!res.win){ hpL=Math.round(hpL*1.8); snL=Math.round(snL*1.6); }
  damageHP(hpL); damageSN(snL);

  let reward=null;
  if(res.win){
    const rw=questReward(q);
    const rin=gainRin(rw.rin), ex=gainExp(rw.exp), kn=gainKnow(rw.know);
    if(rw.sari) S.sari+=rw.sari;
    const loot=Math.random()<(0.22+mod("loot"));
    if(loot) S.lotus+=1;
    if(stage>S.quests.cleared) S.quests.cleared=stage;
    addMark(Math.round(6*q.rank.mul));
    reward={rin,ex,kn,sari:rw.sari,loot};
    pushNews(`[의뢰] ${S.name} 학생이 사건 ${q.no}(${q.rank.r}등급)을 해결했습니다.`);
  }
  S.quests.log.unshift({no:q.no,t:q.t,win:res.win,time:cal().str}); if(S.quests.log.length>30)S.quests.log.pop();
  if(party) S.quests.room=null;

  modal(`의뢰 일지 · ${q.no}`,`
    <div class="spread" style="margin-bottom:8px">
      <div><b>${q.t}</b><div class="tiny muted">${q.ward.n} · <span style="color:${q.rank.c}">${q.rank.r}등급 ${q.rank.n}</span> · ${q.dur}분 소요</div></div>
      <span class="tag ${res.win?"g":"r"}">${res.win?"해결":"철수"}</span></div>
    <div class="log">${res.log.join("<br>")}</div>
    <div class="card pad" style="margin-top:12px">
      ${res.win?`<div class="tiny" style="color:var(--jade)">보상 · 륜 +${nf(reward.rin)} · 경험치 +${nf(reward.ex)} · 지식 +${nf(reward.kn)}${reward.sari?` · 사리 +${reward.sari}`:""}${reward.loot?` · <b style="color:var(--gold)">연등 +1</b>`:""}</div>`
      :`<div class="tiny" style="color:var(--red)">해결하지 못하고 철수했습니다. 보상은 없습니다.</div>`}
      <div class="tiny muted" style="margin-top:4px">체력 −${hpL} · 이성 −${snL}</div>
      <div class="tiny muted" style="margin-top:6px">보고서 · 무엇을 보았고, 무엇을 선택했으며, 다른 방법이 있었는지 적어 제출할 것.</div>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="closeModal()">확인</button>
      ${res.win&&stage===S.quests.cleared?`<button class="btn" onclick="closeModal();runQuest(${stage+1},false)">다음 단계 바로 출동</button>`:""}</div>`,"wide");
  renderTop(); renderNav(); renderMain(); save();
}

let DUEL=null;
VIEWS.duel=()=>{
  const opp=duelOpponents();
  return head("연무장","🗡 대련", `임시 체력 100 · 실제 체력에 반영되지 않습니다`)+`
  <div class="card pad" style="margin-bottom:14px">

    회피는 대항 판정으로, 공격자는 <b>(민첩+1) D5</b>, 방어자는 <b>민첩 D5</b>를 굴려 방어자 쪽이 같거나 높으면 완전히 피합니다.</div>

      <div class="tiny muted" style="margin:5px 0 6px">${o.d}</div>
      <div class="tiny">공 ${o.st.atk} · 방 ${o.st.def} · 민 ${o.st.agi} · 정 ${o.st.men} · 공명 ${o.st.res}</div>
      <button class="btn pri sm" style="margin-top:9px" onclick="startDuel(${i})">대련 신청</button>
    </div>`).join("")}

function duelOpponents(){
  const c=S.course, b=v=>Math.max(1,Math.round(v));
  return [
    {n:"동급생 "+FAKENAMES[(cal().day)%FAKENAMES.length], tag:`${c}과정`, d:"비슷한 시기에 입학한 학생. 서로의 버릇을 대강 안다.",
     st:{atk:b(2+c*.9),def:b(2+c*.8),agi:b(2+c*.8),men:3,res:3}},
    {n:"상급생 "+FAKENAMES[(cal().day+5)%FAKENAMES.length], tag:`${Math.min(7,c+2)}과정`, d:"의뢰 경험이 많다. 들어오는 틈을 기다릴 줄 안다.",
     st:{atk:b(3+c*1.25),def:b(3+c*1.1),agi:b(3+c*1.1),men:4,res:4}},
    {n:"항아 교관", tag:"전투 교관", npc:true, d:"\"허접~♡ 한 바퀴 더 돌까?\" 가속과 급정지를 섞는 고속 근접전.",
     st:{atk:b(6+c*1.6),def:b(4+c*1.2),agi:b(7+c*1.5),men:6,res:6}},
  ];
}
function startDuel(i){
  const o=duelOpponents()[i];
  DUEL={me:mkFighter(S.name,{atk:effStat("atk"),def:effStat("def"),agi:effStat("agi"),men:effStat("men"),res:effStat("res")},100,S.color),
        foe:mkFighter(o.n,o.st,100,"#d2563f"), log:[], turn:0, first:null, phase:"start", npcName:o.n};
  const a=d5(DUEL.me.agi), b=d5(DUEL.foe.agi);
  DUEL.first = a>=b ? "me":"foe";
  DUEL.log.push(`<span class="turn">민첩 판정 · ${esc(S.name)} ${a} vs ${esc(o.n)} ${b} → 선공 ${DUEL.first==="me"?esc(S.name):esc(o.n)}</span>`);
  drawDuel();
}
function drawDuel(){
  const D=DUEL;
  const bar=(f)=>`<div class="spread"><b style="color:${f.c}">${esc(f.n)}</b><span class="tiny muted">${f.hp} / 100</span></div>
    <div class="bar hp" style="margin:4px 0 10px"><i style="width:${f.hp}%"></i></div>`;
  let action="";
  if(D.phase==="done"){
    action=`<div class="row"><button class="btn pri" onclick="closeModal();renderMain()">끝내기</button></div>`;
  }else if(D.phase==="choose"){
    action=`<div class="tiny muted" style="margin-bottom:6px">${esc(D.foe.n)}의 공격입니다. 어떻게 대응하시겠습니까?</div>
      <div class="row"><button class="btn pri" onclick="duelDefend('def')">방어 (방어 D5 + 5)</button>
      <button class="btn" onclick="duelDefend('eva')">회피 (민첩 D5 대항)</button></div>`;
  }else{
    action=`<div class="row"><button class="btn pri" onclick="duelAttack()">공격한다</button>
      <button class="btn" onclick="closeModal()">기권</button></div>`;
  }
  modal(`대련 · ${esc(D.foe.n)}`,`
    ${bar(D.me)}${bar(D.foe)}
    <div class="log" id="dlog">${D.log.join("<br>")}</div>
    <div style="margin-top:12px">${action}</div>`,"");
  const l=$("#dlog"); if(l) l.scrollTop=l.scrollHeight;
}
function duelAttack(){
  const D=DUEL; D.turn++;
  D.log.push(`<span class="turn">${D.turn}턴</span>`);
  D.queue = D.first==="me" ? ["me","foe"] : ["foe","me"];
  duelNext();
}
function duelNext(){
  const D=DUEL; if(!D) return;
  if(!D.queue||!D.queue.length){ D.phase="act"; drawDuel(); return; }
  const who=D.queue.shift();
  if(who==="me"){
    const av=d5(D.me.atk)+5;
    const gp=D.foe.agi-D.foe.def;
    const useEva= gp>1 ? Math.random()<.8 : gp<-1 ? Math.random()<.2 : Math.random()<.5;
    if(useEva){
      const ar=d5(D.me.agi+1), dr=d5(D.foe.agi);
      if(dr>=ar) D.log.push(`<span class="d">${esc(D.me.n)}</span> 공격 <b>${av}</b> → ${esc(D.foe.n)} 회피 ${dr} vs ${ar} · <span class="s">완전 회피</span>`);
      else { D.foe.hp=Math.max(0,D.foe.hp-av); D.log.push(`<span class="d">${esc(D.me.n)}</span> 공격 <b>${av}</b> → 회피 실패 (${dr} vs ${ar}) · <span class="h">−${av}</span>`); }
    }else{
      const dv=d5(D.foe.def)+5, dmg=Math.max(0,av-dv);
      D.foe.hp=Math.max(0,D.foe.hp-dmg);
      D.log.push(`<span class="d">${esc(D.me.n)}</span> 공격 <b>${av}</b> → 방어 <b>${dv}</b> · ${dmg?`<span class="h">−${dmg}</span>`:`<span class="s">완전 방어</span>`}`);
    }
    if(D.foe.hp<=0){ endDuel(true); return; }
    duelNext();
  }else{
    D.pendingAtk=d5(D.foe.atk)+5;
    D.phase="choose"; drawDuel();
  }
}
function duelDefend(mode){
  const D=DUEL; const av=D.pendingAtk;
  if(mode==="def"){
    const dv=d5(D.me.def)+5, dmg=Math.max(0,av-dv);
    D.me.hp=Math.max(0,D.me.hp-dmg);
    D.log.push(`<span class="d">${esc(D.foe.n)}</span> 공격 <b>${av}</b> → 내 방어 <b>${dv}</b> · ${dmg?`<span class="h">−${dmg}</span>`:`<span class="s">완전 방어</span>`}`);
  }else{
    const ar=d5(D.foe.agi+1), dr=d5(D.me.agi);
    if(dr>=ar) D.log.push(`<span class="d">${esc(D.foe.n)}</span> 공격 <b>${av}</b> → 내 회피 ${dr} vs ${ar} · <span class="s">완전 회피</span>`);
    else { D.me.hp=Math.max(0,D.me.hp-av); D.log.push(`<span class="d">${esc(D.foe.n)}</span> 공격 <b>${av}</b> → 회피 실패 (${dr} vs ${ar}) · <span class="h">−${av}</span>`); }
  }
  D.phase="act";
  if(D.me.hp<=0){ endDuel(false); return; }
  duelNext();
}
function endDuel(win){
  const D=DUEL; D.phase="done";
  D.log.push(win?`<span class="s">■ 승리. ${esc(D.foe.n)}이(가) 손을 들었습니다.</span>`
                :`<span class="h">■ 패배. 임시 체력이 바닥났습니다.</span>`);
  const rin=win?gainRin(180+S.course*90):gainRin(60);
  const ex=gainExp(win?160+S.course*70:60);
  addMark(win?10:4);
  D.log.push(`<span class="turn">정산 · 륜 +${nf(rin)} · 경험치 +${nf(ex)}</span>`);
  S.t+=20; drawDuel(); renderTop(); renderNav(); save();
}

  const theory=clamp((avg-(c.need-2))/4,0,1)*74.5;

function takeExam(){
  if(!examReady()){ toast("응시 자격이 충족되지 않았습니다.","bad"); return; }
  const sc=examScore();
  const me=meFighter(); const foe=enemyFor(S.course*8,true);
  const res=simBattle(me,[],[foe],10);
  const duel = res.win ? 31.9 : 31.9*clamp(1-foe.hp/foe.max,0,1)*0.7;
  const total=sc.theory+duel;
  const g=total>=100?"S":total>=90?"A":total>=80?"B":total>=COURSES[S.course-1].line?"C":"F";
  const pass=g!=="F";
  S.t+=120; damageHP(rnd(10,26)); damageSN(rnd(8,20));

    const lo=Math.round(20*m), sa=Math.round(2*m), rin=gainRin(Math.round(1500*m*S.course));
    S.lotus+=lo; S.sari+=sa;
    S.examHist[S.course]={g,score:total.toFixed(1)};
    if(g==="S"&&!S.titleUnlock) { S.titleUnlock=true; }
    S.course=Math.min(7,S.course+1);

    rewardTxt=`연등 +${lo} · 사리 +${sa} · 륜 +${nf(rin)} · <b>${S.course}과정으로 승급</b>`;

  }
  modal("승급 시험 결과",`
    <div style="text-align:center;padding:6px 0 10px">
      <div style="font-size:52px;font-weight:600;color:${pass?"var(--gold)":"var(--red)"};line-height:1">${g}</div>
      <div class="tiny muted">총점 ${total.toFixed(1)} · 이론 ${sc.theory.toFixed(1)} + 대련 ${duel.toFixed(1)}</div>

let BG=null;

  stamp(id);

function drawCard(id){
  let t,b;
  if(id==="food"){ t="🏮 사무전 야시장"; const f=pick(FOODS); b=`<b>${f}</b>을(를) 샀다.<br>${pick(FOODSIT)}`; addMark(3); }

function drawShoot(){
  const g=BG;
  const rings=[72,56,40,18].map((r,i)=>`<div class="ring" style="width:${r*2}px;height:${r*2}px;border-color:${i===2?"#caa548":i===3?"#d2563f":"#4a3f6e"};${i===2?"background:rgba(202,165,72,.06)":""}"></div>`).join("");
  const shots=g.shots.map(s=>`<div class="shot" style="left:${s.x}%;top:${s.y}%"></div>`).join("");
  modal("🎯 염라 님을 맞혀라",`
    <div class="spread" style="margin-bottom:8px">
      <span class="tiny muted">${g.turn} / 3턴 · 이번 턴 남은 탄 ${g.left}발</span>
      <span class="tiny">나 <b style="color:var(--gold)">${g.me}</b> · 과녁지기 <b style="color:var(--red)">${g.foe}</b></span></div>
    <div class="target" id="tgt" onclick="shootAt(event)">
      ${rings}
      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;opacity:.5">😄</div>
      ${shots}
    </div>
    <div class="tiny muted" style="margin-top:8px">과녁을 눌러 쏩니다. 금빛 원 안에 맞으면 1점. 한 턴에 0~3점, 세 턴 누적이 높은 쪽이 승리합니다. 최고 9점이며 동점은 공동 승리입니다.</div>
    ${g.over?`<div class="card pad" style="margin-top:10px"><b>${g.me>g.foe?"승리":g.me<g.foe?"패배":"공동 승리"}</b>
      <div class="tiny muted">${g.me} : ${g.foe} · 승패는 기록되지 않습니다. 편하게 즐겨 주세요.</div></div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="booth('shoot')">한 판 더</button>
      <button class="btn pri" onclick="closeModal();renderMain()">닫기</button></div>`:""}`);
}
function shootAt(e){
  const g=BG; if(g.over||g.left<=0) return;
  const r=$("#tgt").getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
  const dx=(x-50)/100*r.width, dy=(y-50)/100*r.height;
  const d=Math.hypot(dx,dy);
  g.shots.push({x,y});
  if(d<40){ g.me+=1; toast(d<18?"정중앙에 맞혔습니다.":"명중."); }
  g.left--;
  if(g.left<=0){
    const f=rnd(0,3); g.foe+=f;
    toast(`${g.turn}턴 · 과녁지기 ${f}점`);
    if(g.turn>=3){ g.over=true; addMark(8); }
    else { g.turn++; g.left=3; g.shots=[]; }
  }
  drawShoot();
}
function fishAI(){ let s=0; for(let i=0;i<3;i++){ if(i>0&&Math.random()<.45) break;
  if(Math.random()<[0.17,0.33,0.5][i]) return 0; s+=rnd(1,3);} return s; }
function drawFish(){
  const g=BG, next=[17,33,50][g.tries]||50;
  modal("🐠 달빛 금붕어 건지기",`
    <div class="spread" style="margin-bottom:8px">
      <span class="tiny muted">선공(과녁지기)의 확정 점수 <b style="color:var(--red)">${g.foe}점</b></span>
      <span class="tiny">내 누적 <b style="color:var(--gold)">${g.mine}점</b> · ${g.tries}/3회</span></div>
    <div style="position:relative;height:120px;background:radial-gradient(circle,#1b2a3a,#101723);border:1px solid var(--line);border-radius:9px;overflow:hidden">
      ${[0,1,2,3,4].map(i=>`<span class="fish" style="left:${8+i*18}%;top:${18+((i*27)%60)}%;animation-delay:${i*.6}s">🐠</span>`).join("")}
    </div>
    ${g.done?`<div class="card pad" style="margin-top:10px">
        <b>${g.mine>g.foe?"승리":g.mine<g.foe?"패배":"공동 승리"}</b>
        <div class="tiny muted">${g.mine} : ${g.foe} · ${g.broke?"뜰채가 찢어져 그 판의 점수가 0이 되었습니다.":"무사히 확정했습니다."}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="booth('fish')">한 판 더</button>
        <button class="btn pri" onclick="closeModal();renderMain()">닫기</button></div>`
    :`<div class="tiny muted" style="margin:10px 0">다음 건지기의 뜰채 파손 확률은 <b style="color:var(--red)">${next}%</b>입니다. 파손되면 누적 점수가 0이 되고 즉시 종료됩니다.</div>
      <div class="row"><button class="btn pri" onclick="fishScoop()">한 번 건진다</button>
        <button class="btn" onclick="fishStop()">지금 점수로 확정</button></div>`}`);
}
function fishScoop(){
  const g=BG, p=[17,33,50][g.tries]||50;
  g.tries++;
  if(Math.random()*100<p){ g.mine=0; g.broke=true; g.done=true; addMark(8); }
  else { g.mine+=rnd(1,3); if(g.tries>=3){ g.done=true; addMark(8); } }
  drawFish();
}
function fishStop(){ BG.done=true; addMark(8); drawFish(); }

function buy(id){
  const p=SHOP.find(x=>x.id===id);
  if(S.rin<p.c){ toast("륜이 부족합니다.","bad"); return; }
  S.rin-=p.c; S.inv[id]=(S.inv[id]||0)+1;
  renderTop(); renderMain(); save();
}
function useItem(id){
  const p=SHOP.find(x=>x.id===id);
  if(!(S.inv[id]>0)) return;
  S.inv[id]--;
  if(p.type==="heal"){ S.hp=Math.min(100,S.hp+p.v); toast(`체력 +${p.v}`,"good"); }
  if(p.type==="san"){ S.sn=Math.min(100,S.sn+p.v); toast(`이성 +${p.v}`,"good"); }
  if(p.type==="ward"){ S.ward=true; toast("호신 부적을 붙였습니다. 다음 의뢰의 피해가 절반이 됩니다.","good"); }
  if(p.type==="buff"){
    const ex=S.buffs.find(b=>b.n===p.n);
    if(ex) ex.left=Math.min(p.dur*3, ex.left+p.dur);
    else S.buffs.push({n:p.n,key:p.key,v:p.v,left:p.dur,e:p.tag==="식사"?"🍱":"🧪",c:p.tag==="식사"?"#d8a44a":"#4fb3a3"});
    toast(`${p.n} · ${p.d}`,"good");
  }
  renderTop(); renderNav(); renderMain(); save();
}

function addFriend(n){
  n=n||pick(FAKENAMES.filter(x=>!S.friends.find(f=>f.n===x)))||("학생"+rnd(10,99));
  if(S.friends.find(f=>f.n===n)){ toast("이미 인연을 맺은 학생입니다."); return; }
  S.friends.push({n, c:rnd(1,7), lv:rnd(20,90), line:pick(["장인","마무기"]), last:cal().str});
  toast(`${n} 학생과 인연을 맺었습니다.`,"good"); renderMain(); save();
}
function relPropose(name, idx){
  const cur=idx!=null?S.rel[idx]:null;
  modal("관계 "+(cur?"수정 제안":"신청"),`
    <div class="tiny muted" style="margin-bottom:10px">${esc(name)}</div>
    <div class="row" style="margin-bottom:10px">
      ${RELKIND.map(k=>`<button class="btn sm" onclick="relSet('${k}')">${k}</button>`).join("")}</div>
    <label class="f">나는 ${esc(name)} 님의</label><input class="inp" id="ra" maxlength="8" value="${cur?esc(cur.a):"친구"}">
    <label class="f">${esc(name)} 님의 애칭 (선택)</label><input class="inp" id="rn" maxlength="8" value="${cur?esc(cur.nick||""):""}">
    <label class="f">${esc(name)} 님은 나의</label><input class="inp" id="rb" maxlength="8" value="${cur?esc(cur.b):"친구"}">
    <div class="tiny muted" style="margin-top:8px">관계 이름·애칭은 8자까지 가능합니다. 한 학생과는 하나의 관계만 맺을 수 있습니다.</div>
    <div class="row" style="margin-top:14px">
      <button class="btn pri" onclick="relSave('${esc(name)}',${idx==null?"null":idx})">${cur?"수정 제안 보내기":"관계 신청"}</button>
      <button class="btn" onclick="closeModal()">취소</button></div>`);
}
function relSet(k){ const m={"선배·후배":["선배","후배"],"후배·선배":["후배","선배"],"스승·제자":["스승","제자"],"제자·스승":["제자","스승"]};
  const p=m[k]||[k,k]; $("#ra").value=p[0]; $("#rb").value=p[1]; }
function relSave(n, idx){
  const a=$("#ra").value.trim()||"친구", b=$("#rb").value.trim()||"친구", nick=$("#rn").value.trim();
  if(idx!=null&&idx>=0) S.rel[idx]={n,a,b,nick};
  else { if(S.rel.find(r=>r.n===n)){ toast("이미 맺은 관계가 있습니다.","bad"); return; } S.rel.push({n,a,b,nick}); }
  if(!S.friends.find(f=>f.n===n)) addFriend(n);
  closeModal(); renderMain(); toast(`${n} 님이 관계를 수락했습니다.`,"good"); save();
}
function relCut(i){ if(confirm("관계를 끊을까요?")){ S.rel.splice(i,1); renderMain(); save(); } }
function dmTo(n){ S.chatTab="1:1"; addMsg("1:1",n,fmtChat(pick(CHATPOOL.RP)),"#b9b1c6"); renderChat(); toast(`${n}과(와)의 1:1 창을 열었습니다.`); }

function avatarHTML(size, borderCol){
  const b=borderCol||S.color, img=S.avImg;
  if(img) return `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;
    border:2px solid ${b};flex:none;background:#0f0c1c" title="${esc(S.avSrc||"")}">

    display:grid;place-items:center;font-size:${Math.round(size*0.42)}px;background:#0f0c1c;flex:none">${S.av}</div>`;
}
function clearAvatar(){
  if(!confirm("두상 이미지를 지울까요? 기호 두상으로 돌아갑니다.")) return;
  S.avImg=null; S.avSrc="";
  renderTop(); renderNav(); drawMe(); save();

let AV=null;
function openAvatar(forCreate){
  AV={img:null, zoom:1, ox:0, oy:0, F:230, forCreate:!!forCreate, x:0, y:0, w:0, h:0};
  drawAvatarUI();
}
function drawAvatarUI(){
  const a=AV, col=a.forCreate?(window.MK?MK.color:"#caa548"):S.color;
  modal("두상 설정", `
    <div class="tiny muted" style="line-height:1.85;margin-bottom:12px">
      그림을 선택하면 확대·이동해 두상으로 사용할 영역을 정할 수 있습니다. 배경이 투명한 PNG는 투명한 상태로 사용됩니다.
      「적용」을 누르면 100×100으로 줄여 저장합니다.<br>
      <b style="color:var(--red)">생성형 AI로 만든 그림, 허락받지 않은 다른 사람의 그림은 사용할 수 없습니다.</b>
      지원·커미션 결과물이라면 「두상 출처」에 반드시 적어 주세요.
    </div>
    <input type="file" id="avfile" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none">
    <div class="row" style="align-items:flex-start;gap:18px">
      <div style="flex:none">
        <div id="avbox" style="width:${a.F}px;height:${a.F}px;border-radius:50%;overflow:hidden;
          border:2px solid ${col};background:#0f0c1c;position:relative;touch-action:none;
          cursor:${a.img?"grab":"default"}">
          ${a.img?`<img id="avimg" src="${a.img.src}" draggable="false"
             style="position:absolute;user-select:none;pointer-events:none">`
            :`<div style="position:absolute;inset:0;display:grid;place-items:center;color:var(--dim2);font-size:12px;text-align:center;padding:20px">
               그림을 선택해 주세요<br><span style="font-size:11px">선택한 뒤 끌어서 위치를, 아래 막대로 크기를 맞춥니다</span></div>`}
        </div>
        <div class="tiny muted" style="text-align:center;margin-top:6px">원 안이 저장되는 영역입니다</div>
      </div>
      <div style="flex:1;min-width:180px">
        <button class="btn pri" onclick="document.getElementById('avfile').click()">그림 고르기</button>
        <label class="f">크기</label>
        <input type="range" id="avzoom" min="100" max="400" value="${Math.round(a.zoom*100)}"
          style="width:100%" ${a.img?"":"disabled"}>
        <div class="tiny muted">확대 ${Math.round(a.zoom*100)}% · 그림 위를 끌어 옮길 수 있습니다</div>
        <div class="row" style="margin-top:10px">
          <button class="btn sm" ${a.img?"":"disabled"} onclick="avReset()">가운데로</button>
        </div>
        <hr class="hr">
        <div class="tiny muted">${a.img?`원본 ${a.img.naturalWidth}×${a.img.naturalHeight}px → 저장 100×100px`:"아직 그림이 없습니다"}</div>
        <div class="row" style="margin-top:14px">
          <button class="btn pri" ${a.img?"":"disabled"} onclick="avApplySave()">적용</button>
          <button class="btn" onclick="closeModal()">취소</button>
        </div>
      </div>
    </div>`, "wide");
  avBind();
}
function avBind(){
  const a=AV;
  const f=document.getElementById("avfile");
  if(f) f.onchange=e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    if(file.size>12*1024*1024){ toast("그림이 너무 큽니다. 12MB 이하로 올려 주세요.","bad"); return; }
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{ a.img=im; a.zoom=1; a.ox=0; a.oy=0; drawAvatarUI(); };
      im.onerror=()=>toast("그림을 읽지 못했습니다.","bad");
      im.src=rd.result;
    };
    rd.onerror=()=>toast("파일을 읽지 못했습니다.","bad");
    rd.readAsDataURL(file);
  };
  const z=document.getElementById("avzoom");
  if(z) z.oninput=e=>{ a.zoom=(+e.target.value)/100; avLayout();
    const t=z.parentElement.querySelector(".tiny.muted");
    if(t) t.textContent=`확대 ${Math.round(a.zoom*100)}% · 그림 위를 끌어 옮길 수 있습니다`; };
  const box=document.getElementById("avbox");
  if(box&&a.img){
    let sx=0, sy=0, bx=0, by=0, on=false;
    box.onpointerdown=e=>{ on=true; sx=e.clientX; sy=e.clientY; bx=a.ox; by=a.oy;
      box.setPointerCapture(e.pointerId); box.style.cursor="grabbing"; };
    box.onpointermove=e=>{ if(!on) return; a.ox=bx+(e.clientX-sx); a.oy=by+(e.clientY-sy); avLayout(); };
    box.onpointerup=box.onpointercancel=e=>{ on=false; box.style.cursor="grab"; };
    box.onwheel=e=>{ e.preventDefault();
      a.zoom=clamp(a.zoom*(e.deltaY<0?1.08:1/1.08),1,4); avLayout();
      const zz=document.getElementById("avzoom"); if(zz) zz.value=Math.round(a.zoom*100); };
    avLayout();
  }
}
function avLayout(){
  const a=AV, el=document.getElementById("avimg"); if(!el||!a.img) return;
  const nw=a.img.naturalWidth, nh=a.img.naturalHeight;
  const base=Math.max(a.F/nw, a.F/nh), sc=base*a.zoom;
  const w=nw*sc, h=nh*sc;
  let x=(a.F-w)/2+a.ox, y=(a.F-h)/2+a.oy;
  x=clamp(x, a.F-w, 0); y=clamp(y, a.F-h, 0);
  a.ox=x-(a.F-w)/2; a.oy=y-(a.F-h)/2;
  a.x=x; a.y=y; a.w=w; a.h=h;
  el.style.width=w+"px"; el.style.height=h+"px"; el.style.left=x+"px"; el.style.top=y+"px";
}
function avReset(){ AV.ox=0; AV.oy=0; AV.zoom=1; avLayout();
  const z=document.getElementById("avzoom"); if(z) z.value=100; }
function avApplySave(){
  const a=AV; if(!a.img) return;
  avLayout();
  const R=100/a.F;
  const c=document.createElement("canvas"); c.width=100; c.height=100;
  const g=c.getContext("2d");
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high";
  g.drawImage(a.img, a.x*R, a.y*R, a.w*R, a.h*R);   // 배경은 칠하지 않아 투명 PNG가 유지됩니다
  let url;
  try{ url=c.toDataURL("image/png"); }
  catch(e){ toast("그림을 저장하지 못했습니다.","bad"); return; }
  if(a.forCreate){ MK.avImg=url; closeModal(); drawCreate(); toast("두상을 설정했습니다."); return; }
  S.avImg=url;
  closeModal(); renderTop(); renderNav(); renderMain(); drawMe(); save();
  toast("두상을 저장했습니다. 100×100으로 줄여 보관합니다.","good");
}

setTimeout(init,0);
