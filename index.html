:root{
  /* ── 어두운 테마 (기본) ───────────────────────────
     바탕은 s0(가장 어두움) → s7(가장 밝음) 사다리입니다.
     밝은 테마는 이 사다리를 뒤집기만 하면 됩니다. */
  --s0:#0a0616; --s1:#140a24; --s2:#1c0b2c; --s3:#24103a;
  --s4:#331551; --s5:#471a70; --s6:#5d2494; --s7:#6c4e9f;
  --ink:var(--s0); --ink2:var(--s1); --ink3:var(--s2); --ink4:var(--s3);
  --line:var(--s4); --line2:var(--s5);
  --tx:#ece4f9; --dim:#a797c4; --dim2:#7a6a9c;
  --gold:#e05cf5;   --goldD:#9a27b4;  --gold2:var(--goldD);
  --pink:#e870c4;   --pinkD:#8e2a6e;
  --red:#ff4d9e;    --redD:#a8215e;   --red2:var(--redD);
  --violet:#b07cff; --violetL:#c9a6ff;
  --blue:#6aa6ff;   --blueD:#2f5a9e;
  --jade:#3fe0dc;   --jadeD:#1a7a78;
  --ok:#43dfa4;     --warn:#ffa94d;
  --onAcc:#15061c;                      /* 강조색 위에 올리는 글자 */
  --glow:0 0 18px rgba(224,92,245,.20);
  --neon:0 0 10px rgba(224,92,245,.55);
  --glowRGB:224,92,245;
  --glass0:#09041499; --glass1:#0e0620cc; --glassTop:#0b0520e8; --glassTop2:#1a0b30e8;
  --cardA:#1d0b2dd6; --cardB:#160823e8; --subBg:#1f0b31d9; --resBg:#200c31cc;
  --scrim1:rgba(10,6,22,.40); --scrim2:rgba(10,6,22,.68); --scrim3:rgba(8,4,18,.86);
  --wash1:rgba(176,124,255,.16); --wash2:rgba(255,77,158,.12);
  --bgSat:1.05;
  color-scheme:dark;
}
:root[data-theme="light"]{
  /* ── 밝은 테마 ── 색조는 그대로, 명도 사다리만 뒤집었습니다.
     바탕(s0)을 살짝 내려 카드가 떠 보이게 하고, 선(s4)을 또렷하게 잡았습니다. */
  --s0:#ece3f8; --s1:#e4d8f4; --s2:#d9cbef; --s3:#c9b6e8;
  --s4:#ae92d4; --s5:#9375c4; --s6:#7250ad; --s7:#573892;
  --tx:#190c2b; --dim:#51406e; --dim2:#75659a;
  --gold:#a81fc0;   --goldD:#7a1490;
  --pink:#b2318f;   --pinkD:#872465;
  --red:#cf1468;    --redD:#9c0f4e;
  --violet:#7034cc; --violetL:#55249f;
  --blue:#245fb5;   --blueD:#17417e;
  --jade:#0c8482;   --jadeD:#08605e;
  --ok:#0f8f5f;     --warn:#a85c08;
  --onAcc:#fdf8ff;
  --glow:0 0 16px rgba(168,31,192,.18);
  --neon:0 0 8px rgba(168,31,192,.32);
  --glowRGB:168,31,192;
  /* 카드는 거의 흰색으로 띄우고, 바탕에는 네온 도시가 옅게 비치게 둡니다 */
  --glass0:#ffffffd9; --glass1:#fbf7fee8; --glassTop:#fdfafff2; --glassTop2:#f4ecfcf2;
  --cardA:#fffdfff2; --cardB:#f9f4fdf7; --subBg:#f3ecfcee; --resBg:#fdfaffe8;
  --scrim1:rgba(238,231,250,.62); --scrim2:rgba(240,233,251,.78); --scrim3:rgba(244,238,252,.88);
  --wash1:rgba(142,70,230,.16); --wash2:rgba(230,50,130,.10);
  --bgSat:.72;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--ink)}
body{
  background:transparent; color:var(--tx);
  font-family:'IBM Plex Sans KR','IbmPlexSans','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:14px; line-height:1.72; letter-spacing:-.003em;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
}
/* ── 배경 · 네온 명계 ──────────────── */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:url("bg.webp") center top/cover no-repeat;
  filter:saturate(var(--bgSat));
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(1100px 520px at 18% 0%, var(--wash1), transparent 62%),
    radial-gradient(900px 460px at 92% 4%, var(--wash2), transparent 62%),
    linear-gradient(180deg, var(--scrim1) 0%, var(--scrim2) 46%, var(--scrim3) 100%);
}
/* ── 아이콘 ────────────────────────── */
.ic{display:inline-block;vertical-align:-.16em;flex:none}
/* ── 새 버전 알림 띠 ── */
#updbar{display:none}
#updbar.on{display:block;position:sticky;top:0;z-index:80;
  background:linear-gradient(180deg,var(--gold),var(--goldD));color:var(--onAcc);
  font-size:13px;font-weight:600;text-align:center;padding:9px 14px;
  box-shadow:0 2px 14px rgba(var(--glowRGB),.45)}
#updbar button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);
  color:inherit;border-radius:6px;padding:3px 11px;margin-left:10px;font-size:12.5px;font-weight:600}
#updbar button:hover{background:rgba(255,255,255,.3)}
#updbar .x{background:none;border:0;margin-left:6px;opacity:.75;padding:3px 7px}

.logo-top{width:64px;height:38px;color:var(--gold);flex:none;
  filter:drop-shadow(0 0 10px rgba(var(--glowRGB),.45))}
.logo-big{width:min(380px,74vw);height:calc(min(380px,74vw)*0.587);margin:0 auto 10px;color:var(--gold);
  filter:drop-shadow(0 0 22px rgba(var(--glowRGB),.40))}
button .ic, .res .ic, .buffchip .ic{vertical-align:-.2em}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit;background:var(--s1);border:1px solid var(--line);
  border-radius:7px;color:var(--tx);padding:8px 10px;font-size:13.5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(var(--glowRGB),.18)}
input::placeholder,textarea::placeholder{color:var(--dim2)}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--s5)}

/* ── 상단바 ───────────────────────── */
#topbar{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,var(--glassTop2),var(--glassTop));
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.tb1{display:flex;align-items:center;gap:14px;padding:9px 16px}
.seal{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold2);
  display:grid;place-items:center;font-size:15px;color:var(--gold);
  background:radial-gradient(circle at 35% 30%,var(--s4),var(--s1));box-shadow:var(--glow);flex:none}
.me-name{font-weight:600;font-size:15px;letter-spacing:-.01em}
.me-sub{font-size:11.5px;color:var(--dim)}
.res-wrap{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.res{display:flex;align-items:center;gap:6px;background:var(--resBg);border:1px solid var(--line);
  border-radius:7px;padding:4px 10px;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.res b{font-weight:600;letter-spacing:0}
.res .ri{font-size:12px;opacity:.95}
.tb2{display:flex;align-items:center;gap:10px;padding:5px 16px 8px;font-size:11.5px;color:var(--dim);
  border-top:1px solid var(--s2);flex-wrap:wrap}
.buffchip{display:inline-flex;align-items:center;gap:5px;background:var(--s1);border:1px solid var(--s4);
  border-radius:20px;padding:2px 9px;color:var(--violetL)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}

/* ── 레이아웃 ─────────────────────── */
#app{display:grid;grid-template-columns:208px minmax(0,1fr) clamp(320px,25vw,360px);gap:16px;
  max-width:1680px;margin:0 auto;padding:16px;align-items:start}
@media(max-width:1180px){
  #app{grid-template-columns:184px minmax(0,1fr)}

}
@media(max-width:780px){#app{grid-template-columns:1fr;padding:10px} #navcol{order:2} #chatcol{order:3}}

.card{background:linear-gradient(180deg,var(--cardA),var(--cardB));backdrop-filter:blur(3px);border:1px solid var(--line);border-radius:10px}
.pad{padding:14px 16px}
.sect-t{font-size:11px;color:var(--dim2);letter-spacing:.1em;margin:0 0 8px;font-weight:600}

/* 좌측 내비 */
.nav-g{margin-bottom:4px}
.nav-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--tx);
  font-size:13.5px;cursor:pointer;user-select:none}
.nav-h:hover{background:var(--s2)}
.nav-h.on{background:linear-gradient(90deg,var(--s3),var(--s2));color:var(--gold);box-shadow:inset 2px 0 0 var(--gold)}
.nav-h .navic{width:17px;display:grid;place-items:center;opacity:.9;flex:none}
.nav-h .ar{margin-left:auto;font-size:10px;color:var(--dim2)}
.nav-sub{overflow:hidden;max-height:0;transition:max-height .22s ease;pointer-events:none}
.nav-sub.open{max-height:300px;pointer-events:auto}
.nav-i{padding:7px 12px 7px 38px;font-size:13px;color:var(--dim);border-radius:7px;cursor:pointer}
.nav-i:hover{background:var(--s2);color:var(--tx)}
.nav-i.on{color:var(--gold);background:var(--s2)}
.nav-i .bd{float:right;font-size:10px;color:var(--red);}

/* 내 정보 패널 */
.mini-stat{display:flex;justify-content:space-between;font-size:12.5px;padding:2.5px 0;color:var(--dim);font-variant-numeric:tabular-nums}
.mini-stat b{color:var(--tx);font-weight:600}
.bar{height:5px;background:var(--s3);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:4px;transition:width .4s}
.bar.hp>i{background:linear-gradient(90deg,var(--redD),var(--red))}
.bar.sn>i{background:linear-gradient(90deg,var(--s6),var(--violet))}
.bar.jd>i{background:linear-gradient(90deg,var(--jadeD),var(--jadeD))}

/* 공통 UI */
.btn{background:var(--s3);border:1px solid var(--line2);color:var(--tx);border-radius:7px;
  padding:7px 14px;font-size:12.5px;transition:.15s}
.btn:hover{background:var(--s4);border-color:var(--s6)}
.btn.pri{background:linear-gradient(180deg,var(--gold),var(--goldD));border-color:var(--gold);color:var(--onAcc);font-weight:600}
.btn.pri:hover{filter:brightness(1.12)}
.btn.red{background:var(--red);border-color:var(--redD);color:var(--onAcc);font-weight:600}
.btn.red:hover{background:var(--redD)}
.btn.sm{padding:4px 10px;font-size:11.5px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent}
.tag{display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--dim)}
.tag.g{border-color:var(--gold2);color:var(--gold)}
.tag.r{border-color:var(--red2);color:var(--red)}
.tag.j{border-color:var(--jadeD);color:var(--jade)}
.tag.v{border-color:var(--s6);color:var(--violet)}
h1.page{font-size:25px;margin:2px 0 3px;font-weight:600;letter-spacing:-.01em}
.page-kicker{font-size:11px;color:var(--gold2);letter-spacing:.16em;font-weight:500}
.page-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:12px;border-bottom:1px solid var(--line)}
.page-head .rt{margin-left:auto;font-size:12px;color:var(--dim);text-align:right}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.muted{color:var(--dim)}
.tiny{font-size:11.5px}
.hr{height:1px;background:var(--line);margin:12px 0;border:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* 광장 */
.scene{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  height:236px;background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 45%,var(--s2) 100%)}
.scene>svg:not(.ic){position:absolute;inset:0;width:100%;height:100%}
.scene .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:10px 12px;font-size:11.5px}
.sbadge{background:var(--glass1);border:1px solid var(--s4);border-radius:6px;padding:3px 9px;
  display:inline-flex;gap:8px;align-items:center;color:var(--violetL)}
.story-card{background:linear-gradient(135deg,var(--s3),var(--s2));border:1px solid var(--s5);border-radius:10px;padding:14px 16px}
.pips{display:flex;gap:4px}
.pips i{width:7px;height:7px;border-radius:50%;background:var(--s5);display:block}
.pips i.on{background:var(--gold)}
.ticker{overflow:hidden}
.ticker-row{display:flex;gap:9px;align-items:center;font-size:12.5px;padding:4px 0}

/* 과목/연구 카드 */
.sub{background:var(--subBg);border:1px solid var(--line);border-radius:9px;padding:11px 12px;position:relative}
.sub:hover{border-color:var(--line2)}
.sub.active{border-color:var(--gold2);box-shadow:var(--glow)}
.sub h4{margin:0 0 2px;font-size:14px;font-weight:600}
.sub .lv{color:var(--gold);font-weight:600}
.starbtn{position:absolute;right:10px;top:9px;background:none;border:0;color:var(--s5);font-size:14px;padding:0}
.starbtn.on{color:var(--gold)}
.quote{border-left:2px solid var(--line2);padding:4px 0 4px 10px;color:var(--dim);font-size:11.5px;letter-spacing:.01em;line-height:1.8}

/* 테이블 */
table.t{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--s3);text-align:left}
table.t th{color:var(--dim2);font-weight:600;font-size:11px;letter-spacing:.08em}

/* 채팅 */
#chatcol{position:sticky;top:var(--chat-top,112px);min-width:0;
  height:calc(100vh - var(--chat-top,112px) - 16px);
  height:calc(100dvh - var(--chat-top,112px) - 16px)}
.chat-panel{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.chat-panel> :not(.chat-log){flex-shrink:0}
.chat-tabs{display:flex;gap:2px;padding:7px 8px 0;flex-wrap:wrap}
.ctab{font-size:12px;padding:4px 9px;border:0;background:transparent;border-radius:6px 6px 0 0;color:var(--dim);cursor:pointer}
.ctab.on{background:var(--s3);color:var(--gold)}
.chat-toolbar,.chat-compose-mode{display:flex;align-items:center;gap:8px;padding:6px 10px}
.chat-scope{margin-left:auto;text-align:right;overflow-wrap:anywhere}
.chat-context:empty{display:none}
.chat-context{padding:0 10px 7px;font-size:11px;color:var(--dim)}
.chat-context select{width:100%;min-width:0;font-size:12px;padding:5px 8px}
.chat-log{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;overflow-anchor:none;
  padding:8px 10px;font-size:12.5px;line-height:1.7;border-top:1px solid var(--line)}
.cmsg{display:flex;gap:7px;padding:5px 0;align-items:flex-start}
.ctime{color:var(--dim2);font-size:10.5px;flex:none;width:34px;padding-top:2px}
.cbody{min-width:0;flex:1;overflow-wrap:anywhere}
.cname{font-weight:600}
.cbody em{color:var(--violetL);font-style:italic}
.ctitle{font-size:9.5px;border:1px solid var(--s5);border-radius:4px;padding:0 4px;color:var(--violet);white-space:nowrap}
.cmode{display:inline-block;font-size:10px;font-weight:600;line-height:1.5;border:1px solid var(--line2);
  border-radius:4px;padding:0 4px;margin-right:4px;color:var(--violetL);background:var(--s3);vertical-align:1px}
.cmode.owner{color:var(--jade);border-color:var(--jadeD)}
.chat-compose{border-top:1px solid var(--line);background:var(--subBg)}
.chat-compose-mode{padding-bottom:0}
.chat-in{display:flex;gap:6px;padding:8px}
.chat-in input{flex:1;min-width:0;background:var(--s1);border:1px solid var(--line);border-radius:6px;
  color:var(--tx);padding:7px 9px;font-size:12px;outline:none}
.chat-in input:focus{border-color:var(--line2)}
@media(max-width:1180px){#chatcol{position:static;max-height:760px;min-height:320px}}

/* 모달 */
.mask{position:fixed;inset:0;background:var(--glass0);z-index:200;display:flex;align-items:center;
  justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.modal{background:linear-gradient(180deg,var(--s1),var(--s1));border:1px solid var(--line2);
  border-radius:12px;width:min(640px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 24px 70px #000a}
.modal.wide{width:min(900px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:17px;font-weight:600}
.mbody{padding:16px 18px}
.tabs{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tab{padding:7px 12px;font-size:12.5px;color:var(--dim);cursor:pointer;border-radius:7px 7px 0 0}
.tab.on{background:var(--s3);color:var(--gold)}
label.f{display:block;font-size:11.5px;color:var(--dim);margin:10px 0 4px;letter-spacing:.06em}
.inp{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:7px;color:var(--tx);
  padding:8px 10px;font-size:13px;outline:none}
.inp:focus{border-color:var(--line2)}
textarea.inp{min-height:76px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--s1);border:0;color:var(--dim);padding:5px 11px;font-size:11.5px}
.seg button.on{background:var(--s4);color:var(--gold)}

/* 학생증 */
.idcard{border-radius:12px;padding:16px;border:1px solid var(--gold2);position:relative;overflow:hidden;
  background:radial-gradient(500px 220px at 20% 0%,var(--s4),var(--s1))}
.idcard .av{width:70px;height:70px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;
  font-size:27px;background:var(--s0);flex:none}

/* 토스트 */
/* 말풍선은 채팅 입력칸 위로 띄우고, 밑에 있는 것을 누르는 것을 막지 않습니다 */
#toasts{position:fixed;right:16px;bottom:72px;z-index:400;display:flex;flex-direction:column;gap:8px;
  max-width:330px;pointer-events:none}
#toasts>*{pointer-events:auto}
.toast{background:var(--s2);border:1px solid var(--line2);border-left:3px solid var(--gold);
  border-radius:8px;padding:9px 13px;font-size:12.5px;box-shadow:0 10px 30px #000a;animation:tin .25s}
.toast.bad{border-left-color:var(--red)} .toast.good{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}}

/* 로그 */
.log{background:var(--s0);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-size:12.5px;max-height:300px;overflow-y:auto;line-height:1.75;font-variant-numeric:tabular-nums}
.log .d{color:var(--gold)} .log .h{color:var(--red)} .log .s{color:var(--jade)}
.log .turn{color:var(--dim2);border-top:1px dashed var(--s4);margin-top:6px;padding-top:5px;font-size:11px;letter-spacing:.1em}

/* 지도 */
.mapwrap{position:relative;background:linear-gradient(160deg,var(--s1),var(--s1));
  border:1px solid var(--line);border-radius:10px;height:380px}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;width:84px}
.node .nd{width:26px;height:26px;margin:0 auto 3px;border-radius:7px;border:1px solid var(--line2);
  background:var(--s2);display:grid;place-items:center;font-size:13px;transition:.15s}
.node:hover .nd{border-color:var(--gold);background:var(--s4)}
.node.here .nd{border-color:var(--gold);background:var(--s5);box-shadow:var(--glow)}
.node.lock{opacity:.35;cursor:not-allowed}
.node span{font-size:10.5px;color:var(--dim);display:block;line-height:1.3}
.node.here span{color:var(--gold)}

/* 미니게임 */
.booth{background:var(--s1);border:1px solid var(--line);border-radius:9px;padding:13px 14px}
.booth h4{margin:0 0 4px;font-size:14.5px}
.target{position:relative;height:150px;background:radial-gradient(circle,var(--s4),var(--s1));
  border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:crosshair}
.ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid var(--s5)}
.shot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--red);
  transform:translate(-50%,-50%);box-shadow:0 0 8px var(--red)}
.fish{font-size:22px;position:absolute;animation:sw 4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
.mobile-ui{display:none}
.top-actions{display:flex;align-items:center;gap:7px}
.top-avatar{flex:none}

/* ═══ 둘의 기록 · 마스토돈형 대화 타임라인 ═══ */
.mm-compose,.mm-timeline{
  background:linear-gradient(180deg,var(--cardA),var(--cardB));

  overflow:hidden;backdrop-filter:blur(4px)
}
.mm-compose{padding:17px 18px;margin-bottom:14px}

.mm-compose-area{flex:1;min-width:0}

  transition:background .15s ease}

.mm-handle,.mm-time{font-size:12px;color:var(--dim)}
.mm-context{color:var(--dim);font-size:11px;margin:3px 0 0}

  font-size:13.5px;line-height:1.65;margin-top:8px}

  max-width:500px;margin:7px -9px 2px 0}
.mm-action{background:none;border:0;color:var(--dim);cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:5px;min-width:34px;min-height:32px;padding:6px 9px;border-radius:24px;
  font:inherit;font-size:11px;transition:background .15s,color .15s}
.mm-action:hover,.mm-action:focus-visible{color:var(--violetL);background:var(--wash1);outline:none}
.mm-action.on{color:var(--pink)}
.mm-action.on svg{fill:currentColor;fill-opacity:.22}
.mm-action[data-kind="bookmark"].on svg{fill:currentColor;fill-opacity:.15}
.mm-empty{text-align:center;padding:45px 14px;color:var(--dim);font-size:14px}
.mm-empty div{font-size:12px;margin-top:5px;color:var(--dim2)}
.mm-reply-parent{background:var(--subBg);border-left:3px solid var(--s6);padding:12px 13px;
  border-radius:7px;margin-bottom:14px;max-height:220px;overflow:auto}
.mm-reply-snippet{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;line-height:1.65}
@media(max-width:540px){
 .mm-compose{padding:12px 11px}.mm-compose-line{gap:9px}
 .mm-post{grid-template-columns:40px minmax(0,1fr);gap:9px;padding:11px 11px 0}
 .mm-post .mm-avatar>div{transform:scale(.9);transform-origin:top left}
 .mm-post:not(:last-child)>.mm-avatar:after{left:20px;top:46px}
 .mm-byline b{font-size:12.5px}.mm-handle,.mm-time{font-size:11px}
 .mm-message{font-size:13px}.mm-action{padding:6px 4px}
}

const ICLEGACY = {"\u{1F3EE}":"lantern","\u{1F56F}":"candle","\u{1F5E1}":"sword","\u{1F4FF}":"beads",
  "\u{1F311}":"moonDark","\u{1F409}":"dragon","\u{1F98A}":"fox","\u{1FAB7}":"lotus","\u2694":"swords","\u{1F702}":"alcFire"};
function ic(name, size, style){
  const p = ICONS[name] || ICONS[ICLEGACY[name]];
  if(!p) return "";
  const s = size || 16;
  return `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor"`
       + ` stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"`
       + `${style?` style="${style}"`:""}>${p}</svg>`;
}

const CLASS_EFFECTS={atkP:"공격력",defP:"방어력",hpP:"생명력",crit:"치명타 확률",critD:"치명타 피해",

  mana:"파장 재생",study:"수업 보상",snGuard:"이성 소모 감소"};
function combatStyle(){
  if(["근거리","원거리"].includes(S.combatStyle)) return S.combatStyle;
  return /활|궁|총|원거리|사격|투척/.test(S.weapon||"")?"원거리":"근거리";
}
function subjectLevel(id){ return Math.max(0,Math.floor(Number(S.sub[id]?.lv)||0)); }
function subjectGrowth(id,style=combatStyle()){
  return SUBJECT_TRAINING[id]?.[style==="원거리"?"far":"near"]||{};
}
function subjectEffects(id,lv=subjectLevel(id)){
  const t=SUBJECT_TRAINING[id]; if(!t) return {};
  const v={};
  for(const [k,n] of Object.entries(t.per)) v[k]=n*lv;
  for(const m of SUBJECT_MILESTONES) if(lv>=m.lv)
    for(const [k,n] of Object.entries(t.bonus)) v[k]=(v[k]||0)+n*m.mul;
  return v;
}
function subjectMod(key){ return SUBJECTS.reduce((n,s)=>n+(subjectEffects(s.id)[key]||0),0); }
function subjectStat(key){ return SUBJECTS.reduce((n,s)=>n+(subjectGrowth(s.id)[key]||0)*subjectLevel(s.id),0); }
function statGrowthText(values){
  return Object.entries(values).map(([k,v])=>`${STATS.find(s=>s.k===k).n} +${Number(v.toFixed(1))}`).join(" · ");
}
function classEffectText(values,mul=1){
  return Object.entries(values).filter(([,v])=>v>0).map(([k,v])=>`${CLASS_EFFECTS[k]||k} +${Number((v*mul*100).toFixed(1))}${["crit","critD","quality","loot"].includes(k)?"%p":"%"}`).join(" · ")||"아직 수료한 레벨이 없습니다.";
}
function lootQualityChance(){ return clamp(mod("quality"),0,.60); }
function setCombatStyle(style){
  if(!["근거리","원거리"].includes(style)) return;
  S.combatStyle=style;
  renderMain(); renderNav(); renderTop(); save();
  if(typeof syncUp==="function") syncUp(true);
}
function combatStyleHTML(){
  return `<div class="row"><b>전투 거리</b><span class="seg">${["근거리","원거리"].map(t=>`<button class="${combatStyle()===t?"on":""}" aria-pressed="${combatStyle()===t}" onclick="setCombatStyle('${t}')">${t}</button>`).join("")}</span></div>
    <div class="tiny muted" style="margin-top:7px">장인·마무기 모두 선택 가능 · 언제든 변경할 수 있습니다.<br>근거리는 공격·방호, 원거리는 민첩·공명 위주로 과목별 성장치가 달라집니다. 바꾸면 수료한 과목의 성장치도 함께 바뀝니다.</div>`;
}

function load(){
  try{ const r=localStorage.getItem(SAVEKEY); if(!r) return null;
       const o=JSON.parse(r); const base=newState();
       /* 채팅 기록 비우기 — 표식을 올리면 그 다음 접속 때 한 번 더 비웁니다.
          chatFrom 보다 먼저 올라온 글은 서버에 남아 있어도 가져오지 않습니다. */
       if(o.hall && /^h[1-4]$/.test(o.hall)) o.hall="dorm";   // 옛 숙사 → 기숙사
       if((o.chatReset||0) < 3){ o.msgs=[]; o.chatReset=3; o.chatFrom=Date.now(); }
       /* 거처 성장 비우기 — 표식을 올리면 그 다음 접속 때 한 번 더 0단계로 돌아갑니다.
          거주지와 월세 계약도 함께 풀어 처음부터 고르게 합니다. */
       if((o.homeReset||0) < 1){
         o.home={stage:0, due:0, auto:(o.home&&o.home.auto!==undefined)?o.home.auto:true};
         o.homeReset=1;
       }
       if(o.av && ICLEGACY[o.av]) o.av=ICLEGACY[o.av];
       if(o.av && !ICONS[o.av]) o.av="lantern";
       if(o.chatFilter===undefined) o.chatFilter=o.chatTab==="1:1"&&["RP","오너"].includes(o.dmTab)?o.dmTab:"모두";
       /* 제거된 옛 콘텐츠의 저장 기록 정리. 나머지 캐릭터 진행도는 유지합니다. */
       if(o.title==="첫 번째 별") o.title="첫 번째 밤";
       if(o.place==="lounge") o.place="plaza";
       delete o.lounge;
       delete o.pets;
       delete o.mile;
       delete o.snack;
       if(o.ct){ delete o.ct.pet; delete o.ct.dispatch; }
       if(o.mart) delete o.mart.m5;
       if(Array.isArray(o.ach)) o.ach=o.ach.filter(id=>!["a32","a33","a34"].includes(id));
       if(o.book&&o.book.id==="b13") o.book=null;
       if(o.place==="pets"||o.place==="petshop") o.place="plaza";
       return Object.assign(base,o, {sub:Object.assign(base.sub,o.sub||{}), res:Object.assign(base.res,o.res||{})});
  }catch(e){ return null; }
}

const $=(s,r=document)=>r.querySelector(s);

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const nf=n=>{ n=Math.floor(n);
  if(n>=100000000) return Number((n/100000000).toFixed(2))+"억";
  if(n>=10000) return Number((n/10000).toFixed(n>=100000?0:2))+"만";
  return n.toLocaleString("ko-KR"); };
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function d5(n){ let t=0; for(let i=0;i<n;i++) t+=rnd(1,5); return t; }

function toast(msg,kind=""){
  if(typeof QUIET!=="undefined" && QUIET) return;   // 밀린 진행을 돌리는 중에는 조용히
  const d=document.createElement("div"); d.className="toast "+kind; d.innerHTML=msg;
  $("#toasts").appendChild(d);
  setTimeout(()=>{ d.style.transition=".3s"; d.style.opacity=0; d.style.transform="translateX(16px)"; setTimeout(()=>d.remove(),320); },3400);
}

   운영진이 게임 파일을 새로 올리면, 열어 둔 창은 예전 코드를 그대로 쓰고 있습니다.
   파일의 서버 표식(ETag / 수정 시각)을 5분마다 확인해, 바뀌었으면 띠를 띄웁니다.
   운영진이 따로 버전을 적어 넣을 필요는 없습니다. */
const UPDFILES=["index.html","part2.js","part3.js","part4.js","part5.js","part6.js","config.js"];
let UPDSTAMP=null, UPDSHOWN=false;
function updStamps(){
  if(location.protocol==="file:") return Promise.resolve(null);   // 로컬 파일은 확인 불가
  return Promise.all(UPDFILES.map(f=>
    fetch(f+"?_v="+Date.now(), {method:"HEAD", cache:"no-store"})
      .then(r=>r.ok ? (r.headers.get("etag")||r.headers.get("last-modified")||r.headers.get("content-length")||"") : "")
      .catch(()=>"")
  )).then(a=>a.join("|"));
}
function updBarShow(){
  if(UPDSHOWN) return; UPDSHOWN=true;
  const el=document.getElementById("updbar"); if(!el) return;
  el.innerHTML = `새 버전이 올라왔습니다. 새로고침하면 바뀐 내용이 적용됩니다.`
    + `<button onclick="updReload()">새로고침</button>`
    + `<button class="x" onclick="updDismiss()" title="나중에">✕</button>`;
  el.className="on";
}
function updReload(){ try{ save(); }catch(e){} location.reload(true); }
function updDismiss(){ const el=document.getElementById("updbar"); if(el){ el.className=""; el.innerHTML=""; } }
function updCheck(){
  updStamps().then(now=>{
    if(now===null) return;
    if(UPDSTAMP===null){ UPDSTAMP=now; return; }
    if(now && now!==UPDSTAMP) updBarShow();
  });
}
function updStart(){ updCheck(); setInterval(updCheck, 5*60*1000);
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) updCheck(); }); }

/* ── 테마 ───────────────────────────
   어두운 테마가 기본입니다. 고른 값은 브라우저에 따로 저장되므로
   입학 전 화면에서도 유지됩니다. */
const THEMEKEY="mmjy_theme";
let THEME=(function(){ try{ return localStorage.getItem(THEMEKEY)==="light"?"light":"dark"; }catch(e){ return "dark"; } })();
function applyTheme(){
  document.documentElement.setAttribute("data-theme", THEME);
  const mt=document.querySelector('meta[name="theme-color"]');
  if(mt) mt.setAttribute("content", THEME==="light"?"#f7f2fd":"#0a0616");
}
function setTheme(t){
  THEME = t==="light" ? "light" : "dark";
  try{ localStorage.setItem(THEMEKEY, THEME); }catch(e){}
  applyTheme();
  if(typeof renderTop==="function") renderTop();
  if(S && S.made && typeof renderMain==="function") renderMain();
}
function toggleTheme(){ setTheme(THEME==="light"?"dark":"light"); }
applyTheme();

/* ── 시간 ───────────────────────── */
/* 명계력 1024년 무명달 1일 오전 0:00  =  2026년 11월 2일 0시 (한국 시간)
   현실 1분이 흐르면 명계도 1분 흐릅니다. 시계는 접속 여부와 상관없이
   현실 시각에서 바로 계산하므로, 모든 러너가 같은 날짜·같은 시각을 봅니다. */
const GAME_EPOCH = Date.UTC(2026,10,1,15,0,0);   // KST 기준이라 기기 시간대와 무관
function nowMin(){ return (Date.now()-GAME_EPOCH)/60000; }
function cal(){
  const total=Math.floor(S&&S.made?S.t:nowMin());
  const day=Math.floor(total/1440);
  const min=total%1440;
  const y=1024+Math.floor(day/360);
  const m=Math.floor((day%360)/30);
  const dd=(day%30)+1;
  const h=Math.floor(min/60), mm=min%60;
  const ap=h<12?"오전":"오후"; const h12=h%12===0?12:h%12;
  return {y,m:MONTHS[m],dd,h,mm,str:`${ap} ${h12}:${String(mm).padStart(2,"0")}`,
          date:`명계력 ${y}년 ${MONTHS[m]} ${dd}일`, day, min};
}
function hhmm(mins){ mins=Math.max(0,Math.ceil(mins));
  const h=Math.floor(mins/60), m=mins%60;
  return h>0 ? `${h}시간 ${m}분` : `${m}분`; }

/* ── 능력치 / 보정 ───────────────── */
function stat(k){
  /* 예전 저장본의 수업 능력치는 최소 보장값입니다. 새 성장치를 중복해서 더하지 않습니다. */
  const base=Number(S.base[k])||0, old=Number(S.bonus[k])||0;
  return +(base+Math.max(old,Math.min(Math.max(0,statCap(k)-base),subjectStat(k)))).toFixed(1);
}
function statCap(k){ return STATCAP[k][clamp(S.course-1,0,6)]; }
function hallBonus(k){ return 0; }   /* 거주지 혜택은 part3의 HALLBONUS 표가 담당합니다 */
/* 거주지 찾기 — 모르는 값이 들어와도 기숙사로 떨어뜨려 화면이 죽지 않게 합니다 */
function homeOf(id){ return HALLS.find(h=>h.id===id) || HALLS[0]; }
/* 페어 이름 — 공유 기록이 연결됐을 때만 값이 있습니다 (part6 에서 덮어씁니다) */
function pairName(){ return ""; }
function effStat(k){
  let v=stat(k)+hallBonus(k);
  const hpR=S.hp/100, snR=S.sn/100;
  if(k==="atk"||k==="def"){ if(hpR<=.2) v*=.5; else if(hpR<=.5) v*=.8; }
  if(k==="agi"){ if(snR<=.2) v*=.5; else if(snR<=.5) v*=.8; }
  if(k==="atk") v*=1+mod("atkP");
  if(k==="def") v*=1+mod("defP");
  return Math.max(1,Math.round(v));
}
/* 누적 보정치: 연구 + 버프 + 서고 + 날씨 + 거주지 */
function mod(key){
  let v=subjectMod(key);
  const R=S.res;
  if(key==="mana")  v+=R.r1*.06;
  if(key==="study") v+=R.r3*.02;
  if(key==="atkP")  v+=R.r4*.04;
  if(key==="defP")  v+=R.r5*.02;
  if(key==="hpP")   v+=R.r5*.04;
  if(key==="gold")  v+=R.r6*.04;
  if(key==="know")  v+=R.r7*.04;
  if(key==="exp")   v+=R.r8*.04;
  if(key==="loot")  v+=R.r9*.025;
  if(key==="crit")  v+=R.r12*.03;
  if(key==="atkP")  v+=R.r13*.02;
  if(key==="hpP")   v+=R.r13*.02;
  S.buffs.forEach(b=>{ if(b.key===key) v+=b.v; });
  if(S.book){ const b=BOOKS.find(x=>x.id===S.book.id); if(b&&b.k===key) v+=b.v; }
  const w=WEATHERS[S.weather]; if(w.k===key) v+=w.v;
  return v;
}
function manaRate(){ return (18 + S.course*8 + S.lvl*0.6)*(1+mod("mana")); }
function maxMana(){ return Math.round(manaRate()*60*(8 + S.res.r2*4)); }
function power(){
  let p=0;
  p+=effStat("atk")*120+effStat("def")*100+effStat("agi")*90+effStat("men")*80+effStat("res")*110;
  let sl=0; SUBJECTS.forEach(s=>sl+=S.sub[s.id].lv); p+=sl*34;
  let rl=0; RESEARCH.forEach(r=>rl+=S.res[r.id]); p+=rl*58;
  p+=S.course*900 + S.lvl*40;
  return Math.round(p*(1+mod("atkP")*.5));
}
function expNeed(){ return Math.round(260*Math.pow(1.11,S.lvl-1)); }
function gainExp(n){
  n=Math.round(n*(1+mod("exp")));
  S.exp+=n;
  let up=0;
  while(S.exp>=expNeed()){ S.exp-=expNeed(); S.lvl++; up++; }
  if(up) toast(`수행 단계 상승 · <b>Lv ${S.lvl}</b>`,"good");
  return n;
}
function gainRin(n){ n=Math.round(n*(1+mod("gold"))); S.rin+=n; return n; }
function gainKnow(n){ n=Math.round(n*(1+mod("know"))); S.know+=n; return n; }

function damageHP(n){ S.hp=Math.max(1,S.hp-n);
  if(S.hp<=1){ toast("체력이 바닥났습니다. 전투 불능 상태로 퇴장합니다.","bad"); } }
function damageSN(n){
  n=Math.max(0,Math.round(n*(1-clamp(mod("snGuard"),0,.60))));
  const before=S.sn; S.sn=Math.max(1,S.sn-n);
  if(S.sn<=1){ toast("이성이 바닥났습니다. 정상적인 판단이 어렵습니다.","bad"); }
  return before-S.sn;
}

/* ── 메인 틱 ─────────────────────── */
let TICK=null;
function startTick(){ if(TICK) clearInterval(TICK);
  LASTSTEP=Date.now();
  TICK=setInterval(()=>{ const n=Date.now(); const mins=(n-LASTSTEP)/60000;
    if(mins<=0){ LASTSTEP=n; return; }
    LASTSTEP=n; S.lastReal=n; step(mins); },1000); }
let LASTSTEP=Date.now();
function step(mins){
  if(!S.made) return;
  S.t=nowMin();

  // 파장 회복
  S.mana=Math.min(maxMana(), S.mana+manaRate()*mins);

  // 체력/이성 회복
  const rr=1+mod("rest");
  S.hp=Math.min(100,S.hp+0.055*mins*rr);
  S.sn=Math.min(100,S.sn+0.045*mins*rr);

  // 버프 감소
  let bch=false;
  S.buffs.forEach(b=>b.left-=mins);
  if(S.buffs.some(b=>b.left<=0)){ S.buffs=S.buffs.filter(b=>b.left>0); bch=true; }
  if(S.book){ S.book.left-=mins; if(S.book.left<=0){ toast(`「${BOOKS.find(b=>b.id===S.book.id).n}」 열람 효과가 끝났습니다.`); S.book=null; } }

  // 날씨
  S.wNext-=mins;
  if(S.wNext<=0){ S.weather=rnd(0,WEATHERS.length-1); S.wNext=rnd(240,480);
    pushNews(`[석탑] 명계의 기상이 「${WEATHERS[S.weather].n}」로 바뀌었습니다.`); }

  // 통행패
  S.passNext-=mins;
  if(S.passNext<=0){ if(S.pass<3){ S.pass++; toast("통행패 1장이 발급되었습니다."); } S.passNext=720; }

  // 수업
  if(S.lesson){
    S.lesson.left-=mins;
    while(S.lesson && S.lesson.left<=0){
      finishPeriod();
    }
  }
  // 수행(연구)
  if(S.study){
    S.study.left-=mins;
    if(S.study.left<=0) finishResearch();
  }
  // 하루 경계
  const d=cal().day;
  if(d!==S.dayStamp){ S.dayStamp=d; onNewDay(); }

  // 자동 소식/채팅
  if(Math.random()<0.012*mins) pushNews(makeNews());
  if(Math.random()<0.004*mins) npcChat();   // 교사만 말하므로 더 드물게

  renderTop(); renderNav();
  // 의뢰 제목 선택창은 자동 갱신으로 DOM을 교체하지 않습니다.
  // 덕분에 구간 선택을 열어 둔 상태에서 1초마다 접히지 않습니다.
  if(["plaza","class","research","exam"].includes(VIEW)) renderMain(true);
  if(Math.random()<0.02) save();
}
function onNewDay(){
  S.fest.basket=0; S.fest.visits=0; S.fest.todayMarks=0;
  S.outing.done={};
  pushNews("[경비] 새 날이 열렸습니다. 문 앞 공양 바구니가 교체되었습니다.");
  toast("새 날입니다. 공양 바구니와 나들이 이야기가 갱신되었습니다.");
}
function pushNews(t){ S.news.unshift({t, time:cal().str}); if(S.news.length>40) S.news.pop(); }
function makeNews(){
  let s=pick(NEWSPOOL);
  return s.replace("{w}",rnd(1,7)).replace("{r}",pick(RANKS).r)
          .replace("{c}",rnd(1,6)).replace("{g}",pick(["S","A","B"]));
}

/* 오프라인 진행 */
let QUIET=false;
function offline(){
  const el=Math.min(Date.now()-(S.lastReal||Date.now()), 24*3600*1000);
  const mins=Math.floor(el/60000);
  if(mins>5){
    QUIET=true;                       // 밀린 진행을 돌리는 동안에는 알림을 띄우지 않습니다
    try{
      const chunk=120; let left=mins;
      while(left>0){ const c=Math.min(chunk,left); step(c); left-=c; }
    } finally { QUIET=false; }
    toast(`자리를 비운 동안 <b>${hhmm(mins)}</b>이 흘렀습니다.`,"good");
  }
}

function chatModeOf(mode){ return mode==="오너"||mode==="사담"?"오너":"RP"; }
function chatMessages(){

let CHATRESIZE=null;
function chatLayout(){
  const top=document.getElementById("topbar");

  const fit=()=>document.documentElement.style.setProperty("--chat-top",Math.ceil(top.getBoundingClientRect().height+16)+"px");
  fit();

    CHATRESIZE=new ResizeObserver(fit); CHATRESIZE.observe(top);

}
function renderChat(bottom=false){

  S.chatMode=chatModeOf(S.chatMode);

  if(!host.querySelector(".chat-panel")) host.innerHTML=`
  <section class="card chat-panel" aria-label="채팅">

        <button class="btn pri sm" onclick="sendChat()">보내기</button>
      </div>
    </div>
  </section>`;
  const update=(id,html)=>{ const el=document.getElementById(id); if(el._chatHTML!==html){el.innerHTML=html;el._chatHTML=html;} };
  update("chattabs",CHATTABS.map(t=>`<button class="ctab ${S.chatTab===t?"on":""}" aria-pressed="${S.chatTab===t}" onclick="setChatTab('${t}')">${t}</button>`).join(""));
  update("chatfilters",["모두","RP","오너"].map(t=>`<button class="${S.chatFilter===t?"on":""}" aria-pressed="${S.chatFilter===t}" onclick="setChatFilter('${t}')">${t}</button>`).join(""));
  update("chatmodes",["RP","오너"].map(t=>`<button class="${S.chatMode===t?"on":""}" aria-pressed="${S.chatMode===t}" onclick="setChatMode('${t}')">${t}</button>`).join(""));
  $("#chatscope").textContent=S.chatTab==="계통"?S.line+" 학생끼리":S.chatTab==="이웃"?homeOf(S.hall).n:S.chatTab==="페어"?"페어끼리":S.chatTab==="1:1"?(S.dmWith?.name||"상대 선택"):"전원";
  update("chatcontext",typeof chatContextHTML==="function"?chatContextHTML():"");
  $("#chatinput").placeholder=S.chatMode==="RP"?"대사를 입력하고 *행동*은 별표 사이에":"오너 대화를 입력하세요";
  chatLayout();
  const list=chatMessages(), log=$("#chatlog");
  const view=JSON.stringify([S.chatTab,typeof chatScope==="function"?chatScope(S.chatTab):"",S.chatFilter]);
  const follow=bottom||host._chatView!==view||log.scrollHeight-log.clientHeight-log.scrollTop<48;
  const html=list.map(chatMessageHTML).join("")||`<div class="tiny muted" style="padding:14px 2px">${S.chatFilter==="모두"?"아직 오간 말이 없습니다.":S.chatFilter+" 대화가 아직 없습니다."}</div>`;
  if(log._chatHTML!==html){
    const oldTop=log.scrollTop, bounds=log.getBoundingClientRect();
    const anchor=follow?-1:[...log.children].findIndex(el=>el.getBoundingClientRect().bottom>bounds.top);
    const msg=host._chatMessages?.[anchor], offset=anchor<0?0:log.children[anchor].getBoundingClientRect().top-bounds.top;
    log.innerHTML=html; log._chatHTML=html;
    const next=list.indexOf(msg);
    if(!follow) log.scrollTop=next<0?oldTop:log.scrollTop+log.children[next].getBoundingClientRect().top-log.getBoundingClientRect().top-offset;

  if(follow) log.scrollTop=log.scrollHeight;

function subjectLessonCount(lv){ return Math.max(1,Math.floor(Number(lv)||0)+1); }
function subjectLessonMinutes(d){ return d.lv===0?15:60; }
function subjectLessonsLeft(d){
  return Math.max(1,Math.ceil(subjectLessonCount(d.lv)*(1-clamp(Number(d.p)||0,0,100)/100)-1e-9));
}
function subjectNext(d){
  let lv=d.lv, credit=subjectLessonCount(lv)*clamp(Number(d.p)||0,0,100)/100+1;
  while(credit+1e-9>=subjectLessonCount(lv)){
    credit=Math.max(0,credit-subjectLessonCount(lv)); lv++;
  }
  return {lv,p:credit/subjectLessonCount(lv)*100};
}
function lessonPlanMinutes(ids){
  const subjects={}; let minutes=0;
  ids.forEach(id=>{
    const d=subjects[id]||S.sub[id];
    minutes+=subjectLessonMinutes(d); subjects[id]=subjectNext(d);
  });
  return minutes;
}
function lessonReward(id){
  const lv=subjectLevel(id), efficiency=1+mod("study");
  return {know:(20+lv*5)*efficiency,exp:(28+lv*6+S.course*10)*efficiency};
}

  const list=short.length?[...short,...c.subs].slice(0,4):[...c.subs,c.subs[0]];

function startLesson(i){
  const p=S.plans[i]; if(!p) return;
  const minutes=subjectLessonMinutes(S.sub[p.list[0]]);
  S.lesson={plan:[...p.list], idx:0, left:minutes, total:minutes, planIdx:i};
  toast(`「${p.n}」 수업을 시작합니다.`); renderMain(); renderTop(); save();

function quickLesson(id){
  const minutes=subjectLessonMinutes(S.sub[id]);

}
function stopLesson(){ S.lesson=null; renderMain(); renderTop(); }
function finishPeriod(){
  if(typeof notifySound==="function") notifySound("activity");
  const L=S.lesson; const id=L.plan[L.idx]; const s=SUBJECTS.find(x=>x.id===id); const d=S.sub[id];
  const next=subjectNext(d);
  const reward=lessonReward(id);
  gainKnow(reward.know);
  gainExp(reward.exp);
  addMark(5);
  d.p=next.p;
  while(d.lv<next.lv){
    d.lv++;
    toast(`「${s.n}」 Lv ${d.lv} · <b>${classEffectText(SUBJECT_TRAINING[id].per)}</b>`,"good");
    const milestone=SUBJECT_MILESTONES.find(m=>m.lv===d.lv);
    if(milestone) toast(`Lv ${d.lv} 달성 보상 · ${classEffectText(SUBJECT_TRAINING[id].bonus,milestone.mul)}`,"good");
  }
  const extra=L.left; // 음수 캐리
  if(L.idx+1<L.plan.length){ L.idx++; L.total=subjectLessonMinutes(S.sub[L.plan[L.idx]]); L.left=L.total+extra; }
  else { S.lesson=null; toast("시간표를 모두 마쳤습니다."); }
  renderTop(); renderNav(); if(VIEW==="class") renderMain(true); save();
}

  return head("이름 없는 사서의 서가",ic("candle")+" 수행", `수행 자리 <b>${S.study?1:0} / 1</b>`)+`

function effText(r,lv){
  if(lv===0) return "없음";
  const m={r1:["파장 재생",6],r2:["파장 한도","+"+lv*3+"시간분"],r3:["수업 효율",2],r4:["공격력",4],r5:["생명력",4],
    r6:["륜 획득",4],r7:["지식 획득",4],r8:["경험치",4],r9:["전리품 확률",2.5],r10:["공명 배율","+"+(lv*.1).toFixed(1)],
    r11:["가방 칸","+"+lv*5],r12:["강화 성공률",3],r13:["공격·생명력",2]}[r.id];
  if(typeof m[1]==="string") return `${m[0]} ${m[1]}`;
  return `${m[0]} +${(m[1]*lv).toFixed(m[1]%1?1:0)}%`;
}
function cutCost(k){ return k==="mana"?Math.round(manaRate()*72):Math.round(960+S.course*120); }
function startStudy(id){
  if(S.study){ toast("이미 수행 중입니다.","bad"); return; }
  const r=RESEARCH.find(x=>x.id===id), lv=S.res[id];
  if(r.req&&S.course<r.req){ toast(`${r.req}과정부터 가능합니다.`,"bad"); return; }
  if(lv>=r.max){ toast("이미 완료했습니다.","bad"); return; }
  const cost=researchCost(r,lv), cm=cost.mana, ck=cost.know;
  if(S.mana<cm){ toast("파장이 부족합니다.","bad"); return; }
  if(S.know<ck){ toast("지식이 부족합니다.","bad"); return; }
  S.mana-=cm; S.know-=ck;
  const tm=cost.minutes;
  S.study={id, left:tm, total:tm};
  toast(`${r.n} ${lv+1}단계 수행을 시작했습니다.`); renderMain(); renderTop(); save();
}
function cutStudy(k){
  if(!S.study) return; const c=cutCost(k);
  if(k==="mana"&&S.mana<c){ toast("파장이 부족합니다.","bad"); return; }
  if(k==="know"&&S.know<c){ toast("지식이 부족합니다.","bad"); return; }
  if(k==="mana") S.mana-=c; else S.know-=c;
  S.study.left=Math.max(0,S.study.left-60);
  if(S.study.left<=0) finishResearch();
  renderMain(); renderTop();
}
function cancelStudy(){ S.study=null; toast("수행을 중단했습니다."); renderMain(); }
function finishResearch(){
  const r=RESEARCH.find(x=>x.id===S.study.id);
  S.res[r.id]++; S.study=null;
  addMark(12); gainExp(120+S.course*40);
  toast(`<b>${r.n} ${S.res[r.id]}단계</b> 수행을 마쳤습니다.`,"good");
  pushNews(`[서가] ${S.name} 학생이 ${r.n} ${S.res[r.id]}단계를 마쳤습니다.`);
  save();
}
function bookCost(){ return 1940; } // 모든 과정·레벨에서 같은 열람료
function readBook(id){
  const c=bookCost();
  if(S.book&&S.book.id===id){
    if(S.know<c){ toast("지식이 부족합니다.","bad"); return; }
    S.know-=c; S.book.left=Math.min(540,S.book.left+180); toast("열람 시간을 이었습니다.");
  }else{

function addMark(n){

/* ═══════════════════════════════════════════════════
   전투 판정 — 세계관 규칙 (D5)
   공격 판정: 공격 스탯 D5 + 5  /  방어 판정: 방어 스탯 D5 + 5
   회피: 양측 민첩 D5 비교 (대련은 공격자 민첩+1)
   ═══════════════════════════════════════════════════ */
function mkFighter(n,st,hp,c){ return {n, atk:st.atk, def:st.def, agi:st.agi, men:st.men, res:st.res, hp, max:hp, c:c||"var(--violetL)"}; }
function meFighter(tempHP){
  const f=mkFighter(S.name,{atk:effStat("atk"),def:effStat("def"),agi:effStat("agi"),men:effStat("men"),res:effStat("res")},
    tempHP||Math.round(S.hp*(1+mod("hpP"))*1.6+60), S.color);
  const c=C(); f.crit=c.crit; f.critD=c.critD; f.bossDamage=mod("boss");
  return f;
}
function fighterAttack(A,D){
  const critical=Math.random()<clamp(A.crit||0,0,.65);
  const value=Math.round((d5(A.atk)+5)*(critical?Math.max(1,A.critD||2):1)*(D?.boss?1+(A.bossDamage||0):1));
  return {value,critical};
}
function enemyFor(stage,boss){
  const k=stage;
  const st={atk:Math.max(1,Math.round(1.6+k*.32)), def:Math.max(1,Math.round(1.2+k*.28)),
            agi:Math.max(1,Math.round(1.4+k*.26)), men:3, res:2};
  const names=["업귀 잔해","폭주한 마무기","영혼 밀매상","개조 의체 괴한","죄업에 잠식된 악인","마녀의 사역물","업귀"];
  const hp=Math.round(70+k*26)*(boss?2.4:1);
  const f=mkFighter(boss?`【${pick(["무명","잿빛","검은 손","홍월"])}】 ${pick(names)}`:pick(names), st, Math.round(hp), "var(--red)");
  f.boss=!!boss; return f;
}
function resolveAttack(A,D,log,opts={}){
  const bonusEvade=opts.duel?1:0;
  const hit=fighterAttack(A,D), av=hit.value;
  // 민첩이 방어보다 뚜렷하게 높으면 회피를, 아니면 방어를 고른다 (비슷하면 섞는다)
  const gap=D.agi-D.def;
  const wantEvade = gap>1 ? Math.random()<.8 : gap<-1 ? Math.random()<.2 : Math.random()<.5;
  let line=`<span class="d">${esc(A.n)}</span> ${hit.critical?'<b style="color:var(--gold)">치명타!</b> ':""}공격 판정 <b>${av}</b>`;
  if(wantEvade){
    let ar,dr,guard=0;
    do{ ar=d5(A.agi+bonusEvade); dr=d5(D.agi); guard++; }while(ar===dr && guard<8); // 동점은 재판정
    if(dr>ar){ log.push(line+` → ${esc(D.n)} 회피 판정 ${dr} vs ${ar} · <span class="s">완전 회피</span>`); return 0; }
    D.hp=Math.max(0,D.hp-av);
    log.push(line+` → 회피 실패 (${dr} vs ${ar}) · <span class="h">체력 −${av}</span>`);
    return av;
  }else{
    const dv=d5(D.def)+5;
    const dmg=Math.max(0,av-dv);
    D.hp=Math.max(0,D.hp-dmg);
    log.push(line+` → ${esc(D.n)} 방어 판정 <b>${dv}</b> · ${dmg>0?`<span class="h">체력 −${dmg}</span>`:`<span class="s">완전 방어</span>`}`);
    return dmg;
  }
}
function simBattle(me,allies,foes,maxTurn,opts={}){
  const log=[]; let turn=0;
  const order=[me,...allies,...foes].sort((a,b)=>d5(b.agi)-d5(a.agi));
  log.push(`<span class="turn">전투 개시 · 선공 ${esc(order[0].n)}</span>`);
  while(turn<maxTurn){
    turn++;
    log.push(`<span class="turn">${turn}턴</span>`);
    for(const u of order){
      if(u.hp<=0) continue;
      const foe = foes.includes(u);
      const targets = foe ? [me,...allies].filter(x=>x.hp>0) : foes.filter(x=>x.hp>0);
      if(!targets.length) break;
      resolveAttack(u, pick(targets), log, opts);
    }
    if(foes.every(f=>f.hp<=0)){ log.push(`<span class="s">■ 적을 모두 제압했습니다.</span>`); return {win:true,turn,log}; }
    if(me.hp<=0){ log.push(`<span class="h">■ 전투 불능. 현장에서 퇴장합니다.</span>`); return {win:false,turn,log}; }
  }
  log.push(`<span class="turn">제한 턴 종료 · 철수</span>`);
  return {win:false,turn,log,timeout:true};
}

/* ═══════════════ 의뢰 ═══════════════ */
const QUEST_MAX_STAGE=200;
function questGate(){
  const q=S.quests;
  /* 예전 저장본은 순차 진행 기록을 기준으로 이미 지나온 관문을 보존합니다. */
  if(q.gate===undefined) q.gate=Math.floor(clamp(Number(q.cleared)||0,0,QUEST_MAX_STAGE)/10)*10;
  return q.gate;
}
function questOpenLimit(){ return Math.min(QUEST_MAX_STAGE,questGate()+10); }
function questCanEnter(stage){
  return Number.isInteger(stage) && stage>=1 && stage<=questOpenLimit();
}
function questCheck(stage){
  if(questCanEnter(stage)) return true;
  toast(Number.isInteger(stage)&&stage>=1&&stage<=QUEST_MAX_STAGE
    ? `${questGate()+10}단계 관문을 통과해야 다음 구간에 갈 수 있습니다.`
    : `의뢰는 1~${QUEST_MAX_STAGE}단계에서 선택해 주세요.`,"bad");
  return false;
}
function questRecordClear(stage){
  if(!questCanEnter(stage)) return false;
  if(typeof notifySound==="function") notifySound("activity");
  const gate=questGate();
  S.quests.cleared=Math.max(Number(S.quests.cleared)||0,stage);
  if(stage===gate+10){
    S.quests.gate=stage;
    toast(stage===QUEST_MAX_STAGE?"마지막 200단계 관문을 통과했습니다!"
      : `${stage}단계 관문 통과 · ${stage+1}~${stage+9}단계와 ${stage+10}단계 관문이 열렸습니다.`,"good");
  }
  return true;
}
function questAt(stage){
  const seed=stage*7919;
  const r=(n)=>Math.floor((Math.sin(seed*n)*10000)%1000+1000)%1000;
  const rank=RANKS[clamp(Math.floor((stage-1)/30),0,4)];
  const ward=WARDS[r(3)%7];
  const t=`${QT_A[r(1)%QT_A.length]} ${QT_B[r(2)%QT_B.length]}`;
  const dur=30+((r(4)%7)*10);
  const foes=1+Math.floor(stage/8)+ (rank.r==="Ⅴ"?1:0);
  return {stage, rank, ward, t, dur, foes, no:`${1024}-${String(stage).padStart(3,"0")}`};
}
let QFILTER=null;
/* ── 의뢰에 들일 시간 — 길게 잡을수록 총량은 커지고 효율은 조금 떨어집니다 ── */
const QDUR=[{m:30,n:"30분",eff:1},{m:60,n:"1시간",eff:1},{m:120,n:"2시간",eff:.97},{m:180,n:"3시간",eff:.94}];
function qDurIdx(){ const i=Number(S.quests.durIdx); return (Number.isInteger(i)&&QDUR[i])?i:1; }
function qDur(){ return QDUR[qDurIdx()]; }
function qEffOf(mins){ const d=QDUR.find(x=>x.m===Number(mins)); return d?d.eff:1; }
function qSetDur(i){ S.quests.durIdx=clamp(i,0,QDUR.length-1); renderMain(); save(); }
function qStage(){ const v=Number(S.quests.pick);
  return (Number.isInteger(v)&&v>=1&&v<=QUEST_MAX_STAGE)?v:Math.max(1,questOpenLimit()); }
function qSetStage(v){ S.quests.pick=clamp(Math.round(Number(v)||1),1,QUEST_MAX_STAGE); renderMain(); save(); }
function qClock(mins){ return new Date(Date.now()+mins*60000).toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"}); }
/* 관문은 짧게 끊어 통과할 수 없게 합니다 */
function qGateMin(stage){ return stage%10===0 ? 60 : 0; }

/* 예상치 — 실제 전투가 쓰는 숫자로 어림잡습니다. 주사위라 실제와는 차이가 납니다. */
function questEstimate(stage, mins){
  const unit=(typeof RUNSTEPMIN!=="undefined")?RUNSTEPMIN:0.5;
  const steps=Math.max(1,Math.floor(mins/unit));
  const c=(typeof C==="function")?C():{crit:0,critD:2};
  const atk=effStat("atk"), agi=effStat("agi");
  const avg=(3*atk+5)*(1+clamp(c.crit||0,0,.65)*(Math.max(1,c.critD||2)-1));
  const eDef=Math.max(1,Math.round(1.2+stage*.28));
  const eAgi=Math.max(1,Math.round(1.4+stage*.26));
  const eHp =Math.round(70+stage*26);
  const hitP=clamp(.5+(agi-eAgi)/(2*Math.max(1,agi+eAgi)),.15,.95);
  const per =.5*(avg*hitP)+.5*Math.max(0,avg-(3*eDef+5));
  /* 마지막 일격은 남은 체력보다 세게 들어가 그만큼 흘립니다. 한 체를 넘어뜨리는 데
     실제로 드는 피해는 체력보다 반 대 정도 더 듭니다. 처치마다 다음 적을 만나는
     줄 하나도 쓰입니다. */
  const eHpEff=eHp+per*0.5;
  let kills=0;
  for(let i=0;i<4;i++) kills=Math.max(0,Math.floor(Math.max(0,steps-kills)*0.8*0.58*per/eHpEff));
  const q=questAt(stage), eff=qEffOf(mins), m=q.rank.mul;
  const g=1+mod("gold"), e=1+mod("exp"), k=1+mod("know");
  return { steps, kills, eff,
    rin :Math.round(kills*(40+stage*14)*m*g*eff),
    exp :Math.round(kills*(60+stage*22)*.6*e*eff),
    know:Math.round(kills*(10+stage*4)*.5*k*eff),
    gear:Math.round(kills*(0.14+mod("loot"))*10)/10,
    bmat:Math.round(kills*0.7*(3+stage/12)),
    clearRin:Math.round((120+stage*48)*eff*g),
    clearExp:Math.round((90+stage*34)*eff*e) };
}

function questReward(q){
  const m=q.rank.mul, k=q.stage;
  return {rin:Math.round((120+k*48)*m), exp:Math.round((90+k*34)*m), know:Math.round((18+k*7)*m),
          sari:(q.rank.r==="Ⅳ"&&Math.random()<.3)||q.rank.r==="Ⅴ"?1:0};
}
function makeRoom(st){ if(!questCheck(st)) return; S.quests.room={stage:st,pos:"후열",party:[]}; renderMain(); toast("함께 의뢰 방을 열었습니다. 다른 학생이 들어오기를 기다립니다."); }
function leaveRoom(){ S.quests.room=null; renderMain(); }
function setPos(p){ S.quests.room.pos=p; renderMain(); }
function inviteParty(){
  const r=S.quests.room; if(r.party.length>=3){ toast("자리가 다 찼습니다.","bad"); return; }
  const pool=S.friends.map(f=>f.n);
  if(!pool.length){ toast("함께 갈 사람이 없습니다. 의뢰 화면 아래 「함께 가기」에서 방을 열어 보세요.","bad"); return; }
  r.party.push({n:pick(pool), pos:pick(["선봉","후열","지원"]), lv:rnd(1,7)});
  renderMain(); toast("동행 요청을 수락했습니다.");
}
function inviteTeacher(){
  const r=S.quests.room; if(r.party.length>=3){ toast("자리가 다 찼습니다.","bad"); return; }
  if(S.rin<600){ toast("륜이 부족합니다.","bad"); return; }
  S.rin-=600;
  const t=pick(["항아","삼장","강시","양귀비"]);
  r.party.push({n:NPC[t].n, pos:"선봉", teacher:true, lv:9});
  renderMain(); renderTop(); toast(`${NPC[t].n} 교사가 동행합니다.`,"good");
}
function runQuest(stage,party){
  if(!questCheck(stage)) return;
  const q=questAt(stage);
  if(S.hp<=10){ toast("체력이 너무 낮습니다. 보건실에서 회복하세요.","bad"); return; }
  const room=party?S.quests.room:null;
  const pos=room?room.pos:"후열";
  const me=meFighter();
  if(pos==="선봉") me.atk=Math.round(me.atk*1.1);
  const allies=(room?room.party:[]).map(p=>mkFighter(p.n,
    {atk:Math.max(1,Math.round((p.teacher?7:2)+p.lv*.6)), def:Math.max(1,Math.round((p.teacher?6:2)+p.lv*.5)),
     agi:Math.max(1,Math.round((p.teacher?6:2)+p.lv*.5)), men:3,res:3},
    Math.round(120+p.lv*40), p.teacher?"var(--gold)":"var(--blue)"));
  const foes=Array.from({length:q.foes},(_,i)=>enemyFor(stage, i===0&&q.rank.r==="Ⅴ"));
  const res=simBattle(me,allies,foes,10);

  let hpL=rnd(q.rank.hp[0],q.rank.hp[1]), snL=rnd(q.rank.sn[0],q.rank.sn[1]);
  if(pos==="선봉") hpL=Math.round(hpL*1.1);
  if(pos==="지원"){ hpL=Math.round(hpL*.8); snL=Math.round(snL*.8); }
  if(S.ward){ hpL=Math.round(hpL*.5); snL=Math.round(snL*.5); S.ward=false; }
  if(!res.win){ hpL=Math.round(hpL*1.8); snL=Math.round(snL*1.6); }
  damageHP(hpL); snL=damageSN(snL);

  let reward=null;
  if(res.win){
    const rw=questReward(q);
    const rin=gainRin(rw.rin), ex=gainExp(rw.exp), kn=gainKnow(rw.know);
    if(rw.sari) S.sari+=rw.sari;
    const loot=Math.random()<(0.22+mod("loot"));
    if(loot) S.lotus+=1;
    questRecordClear(stage);
    addMark(Math.round(6*q.rank.mul));
    reward={rin,ex,kn,sari:rw.sari,loot};
    pushNews(`[의뢰] ${S.name} 학생이 사건 ${q.no}(${q.rank.r}등급)을 해결했습니다.`);
  }
  S.quests.log.unshift({no:q.no,t:q.t,win:res.win,time:cal().str}); if(S.quests.log.length>30)S.quests.log.pop();
  if(party) S.quests.room=null;

  modal(`의뢰 일지 · ${q.no}`,`
    <div class="spread" style="margin-bottom:8px">
      <div><b>${q.t}</b><div class="tiny muted">${q.ward.n} · <span style="color:${q.rank.c}">${q.rank.r}등급 ${q.rank.n}</span> · ${q.dur}분 소요</div></div>
      <span class="tag ${res.win?"g":"r"}">${res.win?"해결":"철수"}</span></div>
    <div class="log">${res.log.join("<br>")}</div>
    <div class="card pad" style="margin-top:12px">
      ${res.win?`<div class="tiny" style="color:var(--jade)">보상 · 륜 +${nf(reward.rin)} · 경험치 +${nf(reward.ex)} · 지식 +${nf(reward.kn)}${reward.sari?` · 사리 +${reward.sari}`:""}${reward.loot?` · <b style="color:var(--gold)">연등 +1</b>`:""}</div>`
      :`<div class="tiny" style="color:var(--red)">해결하지 못하고 철수했습니다. 보상은 없습니다.</div>`}
      <div class="tiny muted" style="margin-top:4px">체력 −${hpL} · 이성 −${snL}</div>
      <div class="tiny muted" style="margin-top:6px">보고서 · 무엇을 보았고, 무엇을 선택했으며, 다른 방법이 있었는지 적어 제출할 것.</div>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn pri" onclick="closeModal()">확인</button>
      ${res.win&&questCanEnter(stage+1)?`<button class="btn" onclick="closeModal();runQuest(${stage+1},false)">다음 단계 바로 출동</button>`:""}</div>`,"wide");
  renderTop(); renderNav(); renderMain(); save();
}

let DUEL=null;
VIEWS.duel=()=>{
  const opp=duelOpponents();
  return head("연무장",ic("sword")+" 대련", `임시 체력 100 · 실제 체력에 반영되지 않습니다`)+`
  <div class="card pad" style="margin-bottom:14px">
    <div class="sect-t">판정 규칙</div>
    <div class="tiny muted">선공·후공은 민첩 판정(민첩 D5)으로 정합니다. 공격 판정은 <b>공격 D5 + 5</b>,
    방어 판정은 <b>방어 D5 + 5</b>이며 차이만큼 임시 체력이 깎입니다.
    회피는 대항 판정으로, 공격자는 <b>(민첩+1) D5</b>, 방어자는 <b>민첩 D5</b>를 굴려 방어자 쪽이 같거나 높으면 완전히 피합니다.</div>
  </div>
  <div class="grid g3">
    ${opp.map((o,i)=>`<div class="sub">
      <div class="spread"><h4 style="margin:0">${o.n}</h4><span class="tag ${o.npc?"g":""}">${o.tag}</span></div>
      <div class="tiny muted" style="margin:5px 0 6px">${o.d}</div>
      <div class="tiny">공 ${o.st.atk} · 방 ${o.st.def} · 민 ${o.st.agi} · 정 ${o.st.men} · 공명 ${o.st.res}</div>
      <button class="btn pri sm" style="margin-top:9px" onclick="startDuel(${i})">대련 신청</button>
    </div>`).join("")}
  </div>`;
};
function duelOpponents(){
  const c=S.course, b=v=>Math.max(1,Math.round(v));
  return [
    {n:"강시 경비", tag:"경비", npc:true, d:"\"통금은 오전 2시다.\" 물러서지 않고 버티는 방식. 맞혀도 좀처럼 흔들리지 않는다.",
     st:{atk:b(2+c*.9),def:b(4+c*1.1),agi:b(1+c*.5),men:4,res:3}},
    {n:"양귀비 교사", tag:"담임 교사", npc:true, d:"\"오늘은 무얼 할 거니.\" 파장을 읽어 먼저 자리를 잡는다.",
     st:{atk:b(3+c*1.1),def:b(3+c*1.0),agi:b(4+c*1.2),men:6,res:5}},
    {n:"항아 교관", tag:"전투 교관", npc:true, d:"\"허접~♡ 한 바퀴 더 돌까?\" 가속과 급정지를 섞는 고속 근접전.",
     st:{atk:b(6+c*1.6),def:b(4+c*1.2),agi:b(7+c*1.5),men:6,res:6}},
  ];
}
function startDuel(i){
  const o=duelOpponents()[i];
  DUEL={me:mkFighter(S.name,{atk:effStat("atk"),def:effStat("def"),agi:effStat("agi"),men:effStat("men"),res:effStat("res")},100,S.color),
        foe:mkFighter(o.n,o.st,100,"var(--red)"), log:[], turn:0, first:null, phase:"start", npcName:o.n};
  const a=d5(DUEL.me.agi), b=d5(DUEL.foe.agi);
  DUEL.first = a>=b ? "me":"foe";
  DUEL.log.push(`<span class="turn">민첩 판정 · ${esc(S.name)} ${a} vs ${esc(o.n)} ${b} → 선공 ${DUEL.first==="me"?esc(S.name):esc(o.n)}</span>`);
  drawDuel();
}
function drawDuel(){
  const D=DUEL;
  const bar=(f)=>`<div class="spread"><b style="color:${f.c}">${esc(f.n)}</b><span class="tiny muted">${f.hp} / 100</span></div>
    <div class="bar hp" style="margin:4px 0 10px"><i style="width:${f.hp}%"></i></div>`;
  let action="";
  if(D.phase==="done"){
    action=`<div class="row"><button class="btn pri" onclick="closeModal();renderMain()">끝내기</button></div>`;
  }else if(D.phase==="choose"){
    action=`<div class="tiny muted" style="margin-bottom:6px">${esc(D.foe.n)}의 공격입니다. 어떻게 대응하시겠습니까?</div>
      <div class="row"><button class="btn pri" onclick="duelDefend('def')">방어 (방어 D5 + 5)</button>
      <button class="btn" onclick="duelDefend('eva')">회피 (민첩 D5 대항)</button></div>`;
  }else{
    action=`<div class="row"><button class="btn pri" onclick="duelAttack()">공격한다</button>
      <button class="btn" onclick="closeModal()">기권</button></div>`;
  }
  modal(`대련 · ${esc(D.foe.n)}`,`
    ${bar(D.me)}${bar(D.foe)}
    <div class="log" id="dlog">${D.log.join("<br>")}</div>
    <div style="margin-top:12px">${action}</div>`,"");
  const l=$("#dlog"); if(l) l.scrollTop=l.scrollHeight;
}
function duelAttack(){
  const D=DUEL; D.turn++;
  D.log.push(`<span class="turn">${D.turn}턴</span>`);
  D.queue = D.first==="me" ? ["me","foe"] : ["foe","me"];
  duelNext();
}
function duelNext(){
  const D=DUEL; if(!D) return;
  if(!D.queue||!D.queue.length){ D.phase="act"; drawDuel(); return; }
  const who=D.queue.shift();
  if(who==="me"){
    const hit=fighterAttack(D.me,D.foe), av=hit.value;
    if(hit.critical) D.log.push(`<span style="color:var(--gold)">치명타! · 피해 ×${D.me.critD.toFixed(2)}</span>`);
    const gp=D.foe.agi-D.foe.def;
    const useEva= gp>1 ? Math.random()<.8 : gp<-1 ? Math.random()<.2 : Math.random()<.5;
    if(useEva){
      const ar=d5(D.me.agi+1), dr=d5(D.foe.agi);
      if(dr>=ar) D.log.push(`<span class="d">${esc(D.me.n)}</span> 공격 <b>${av}</b> → ${esc(D.foe.n)} 회피 ${dr} vs ${ar} · <span class="s">완전 회피</span>`);
      else { D.foe.hp=Math.max(0,D.foe.hp-av); D.log.push(`<span class="d">${esc(D.me.n)}</span> 공격 <b>${av}</b> → 회피 실패 (${dr} vs ${ar}) · <span class="h">−${av}</span>`); }
    }else{
      const dv=d5(D.foe.def)+5, dmg=Math.max(0,av-dv);
      D.foe.hp=Math.max(0,D.foe.hp-dmg);
      D.log.push(`<span class="d">${esc(D.me.n)}</span> 공격 <b>${av}</b> → 방어 <b>${dv}</b> · ${dmg?`<span class="h">−${dmg}</span>`:`<span class="s">완전 방어</span>`}`);
    }
    if(D.foe.hp<=0){ endDuel(true); return; }
    duelNext();
  }else{
    const hit=fighterAttack(D.foe,D.me); D.pendingAtk=hit.value;
    if(hit.critical) D.log.push(`<span style="color:var(--gold)">${esc(D.foe.n)}의 치명타!</span>`);
    D.phase="choose"; drawDuel();
  }
}
function duelDefend(mode){
  const D=DUEL; const av=D.pendingAtk;
  if(mode==="def"){
    const dv=d5(D.me.def)+5, dmg=Math.max(0,av-dv);
    D.me.hp=Math.max(0,D.me.hp-dmg);
    D.log.push(`<span class="d">${esc(D.foe.n)}</span> 공격 <b>${av}</b> → 내 방어 <b>${dv}</b> · ${dmg?`<span class="h">−${dmg}</span>`:`<span class="s">완전 방어</span>`}`);
  }else{
    const ar=d5(D.foe.agi+1), dr=d5(D.me.agi);
    if(dr>=ar) D.log.push(`<span class="d">${esc(D.foe.n)}</span> 공격 <b>${av}</b> → 내 회피 ${dr} vs ${ar} · <span class="s">완전 회피</span>`);
    else { D.me.hp=Math.max(0,D.me.hp-av); D.log.push(`<span class="d">${esc(D.foe.n)}</span> 공격 <b>${av}</b> → 회피 실패 (${dr} vs ${ar}) · <span class="h">−${av}</span>`); }
  }
  D.phase="act";
  if(D.me.hp<=0){ endDuel(false); return; }
  duelNext();
}
function endDuel(win){
  const D=DUEL; D.phase="done";
  D.log.push(win?`<span class="s">■ 승리. ${esc(D.foe.n)}이(가) 손을 들었습니다.</span>`
                :`<span class="h">■ 패배. 임시 체력이 바닥났습니다.</span>`);
  const rin=win?gainRin(180+S.course*90):gainRin(60);
  const ex=gainExp(win?160+S.course*70:60);
  addMark(win?10:4);
  D.log.push(`<span class="turn">정산 · 륜 +${nf(rin)} · 경험치 +${nf(ex)}</span>`);
  drawDuel(); renderTop(); renderNav(); save();
}

function takeExam(){
  if(!examReady()){ toast("응시 자격이 충족되지 않았습니다.","bad"); return; }
  const sc=examScore();
  const me=meFighter(); const foe=enemyFor(S.course*8,true);
  const res=simBattle(me,[],[foe],10);
  const duel = res.win ? 31.9 : 31.9*clamp(1-foe.hp/foe.max,0,1)*0.7;
  const total=sc.theory+duel;
  const g=total>=100?"S":total>=90?"A":total>=80?"B":total>=COURSES[S.course-1].line?"C":"F";
  const pass=g!=="F";
  damageHP(rnd(10,26)); damageSN(rnd(8,20));
  let rewardTxt="";
  if(pass){
    const m={S:2,A:1.5,B:1.2,C:1}[g];
    const lo=Math.round(20*m), sa=Math.round(2*m), rin=gainRin(Math.round(1500*m*S.course));
    S.lotus+=lo; S.sari+=sa;
    S.examHist[S.course]={g,score:total.toFixed(1)};
    if(g==="S"&&!S.titleUnlock) { S.titleUnlock=true; }
    S.course=Math.min(7,S.course+1);
    gainExp(1200*S.course);
    rewardTxt=`연등 +${lo} · 사리 +${sa} · 륜 +${nf(rin)} · <b>${S.course}과정으로 승급</b>`;
    pushNews(`[수석 진급] ${S.name} 학생이 ${S.course-1}과정 시험을 ${g}등급(${total.toFixed(0)}점)으로 통과하고 ${S.course}과정으로 진급했습니다.`);
  }
  modal("승급 시험 결과",`
    <div style="text-align:center;padding:6px 0 10px">
      <div style="font-size:52px;font-weight:600;color:${pass?"var(--gold)":"var(--red)"};line-height:1">${g}</div>
      <div class="tiny muted">총점 ${total.toFixed(1)} · 이론 ${sc.theory.toFixed(1)} + 대련 ${duel.toFixed(1)}</div>
    </div>
    <div class="log">${res.log.join("<br>")}</div>
    ${pass?`<div class="card pad" style="margin-top:12px"><div class="tiny" style="color:var(--jade)">${rewardTxt}</div></div>`
          :`<div class="tiny" style="margin-top:10px;color:var(--red)">합격선 ${COURSES[S.course-1].line}점에 미치지 못했습니다. 과목 레벨을 더 올린 뒤 다시 응시할 수 있습니다.</div>`}

function festivalExchange(id){
  const costs={ward:30,rare:55,hero:90};

  if(!c || S.fest.marks<c || festExchanged(id)) { toast("표식이 부족하거나 오늘 이미 교환했습니다.","bad"); return; }
  if((id==="rare"||id==="hero") && S.bag.length>=40+(S.res.r11||0)*5){
    toast("바랑이 가득 찼습니다. 공간을 비운 뒤 교환해 주세요.","bad"); return;
  }
  S.fest.marks-=c;
  if(id==="ward"){
    S.inv.p9=(S.inv.p9||0)+1;
    S.inv.p6=(S.inv.p6||0)+2;
    toast("호신 부적 1개와 수호의 탕약 2개를 받았습니다.","good");
  } else {
    const it=mkGear(Math.max(1,S.lvl),id==="hero"?3:2);

    toast(`${id==="hero"?"영웅":"희귀"} 법구 「${esc(it.name)}」를 받았습니다.`,"good");
  }
  if(!S.fest.exchange || S.fest.exchange.day!==cal().day) S.fest.exchange={day:cal().day,items:{}};
  S.fest.exchange.items[id]=true;
  renderTop();renderMain();save();
}
function exchangeMark(n){

}

function drawShoot(){
  const g=BG;
  const rings=[72,56,40,18].map((r,i)=>`<div class="ring" style="width:${r*2}px;height:${r*2}px;border-color:${i===2?"var(--gold)":i===3?"var(--red)":"var(--s5)"};${i===2?"background:rgba(201,45,229,.06)":""}"></div>`).join("");
  const shots=g.shots.map(s=>`<div class="shot" style="left:${s.x}%;top:${s.y}%"></div>`).join("");
  modal(ic("target")+" 염라 님을 맞혀라",`
    <div class="spread" style="margin-bottom:8px">
      <span class="tiny muted">${g.turn} / 3턴 · 이번 턴 남은 탄 ${g.left}발</span>
      <span class="tiny">나 <b style="color:var(--gold)">${g.me}</b> · 과녁지기 <b style="color:var(--red)">${g.foe}</b></span></div>
    <div class="target" id="tgt" onclick="shootAt(event)">
      ${rings}
      <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;opacity:.5">${ic("smile",22)}</div>
      ${shots}
    </div>
    <div class="tiny muted" style="margin-top:8px">과녁을 눌러 쏩니다. 금빛 원 안에 맞으면 1점. 한 턴에 0~3점, 세 턴 누적이 높은 쪽이 승리합니다. 최고 9점이며 동점은 공동 승리입니다.</div>
    ${g.over?`<div class="card pad" style="margin-top:10px"><b>${g.me>g.foe?"승리":g.me<g.foe?"패배":"공동 승리"}</b>
      <div class="tiny muted">${g.me} : ${g.foe} · 승패는 기록되지 않습니다. 편하게 즐겨 주세요.</div></div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="booth('shoot')">한 판 더</button>
      <button class="btn pri" onclick="closeModal();renderMain()">닫기</button></div>`:""}`);
}
function shootAt(e){
  const g=BG; if(g.over||g.left<=0) return;
  const r=$("#tgt").getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
  const dx=(x-50)/100*r.width, dy=(y-50)/100*r.height;
  const d=Math.hypot(dx,dy);
  g.shots.push({x,y});
  if(d<40){ g.me+=1; toast(d<18?"정중앙에 맞혔습니다.":"명중."); }
  g.left--;
  if(g.left<=0){
    const f=rnd(0,3); g.foe+=f;
    toast(`${g.turn}턴 · 과녁지기 ${f}점`);
    if(g.turn>=3){ g.over=true; addMark(8); }
    else { g.turn++; g.left=3; g.shots=[]; }
  }
  drawShoot();
}
function fishAI(){ let s=0; for(let i=0;i<3;i++){ if(i>0&&Math.random()<.45) break;
  if(Math.random()<[0.17,0.33,0.5][i]) return 0; s+=rnd(1,3);} return s; }
function drawFish(){
  const g=BG, next=[17,33,50][g.tries]||50;

    <div style="position:relative;height:120px;background:radial-gradient(circle,var(--s3),var(--s1));border:1px solid var(--line);border-radius:9px;overflow:hidden">

    </div>
    ${g.done?`<div class="card pad" style="margin-top:10px">
        <b>${g.mine>g.foe?"승리":g.mine<g.foe?"패배":"공동 승리"}</b>
        <div class="tiny muted">${g.mine} : ${g.foe} · ${g.broke?"뜰채가 찢어져 그 판의 점수가 0이 되었습니다.":"무사히 확정했습니다."}</div></div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="booth('fish')">한 판 더</button>
        <button class="btn pri" onclick="closeModal();renderMain()">닫기</button></div>`
    :`<div class="tiny muted" style="margin:10px 0">다음 건지기의 뜰채 파손 확률은 <b style="color:var(--red)">${next}%</b>입니다. 파손되면 누적 점수가 0이 되고 즉시 종료됩니다.</div>
      <div class="row"><button class="btn pri" onclick="fishScoop()">한 번 건진다</button>
        <button class="btn" onclick="fishStop()">지금 점수로 확정</button></div>`}`);
}
function fishScoop(){
  const g=BG, p=[17,33,50][g.tries]||50;
  g.tries++;
  if(Math.random()*100<p){ g.mine=0; g.broke=true; g.done=true; addMark(8); }
  else { g.mine+=rnd(1,3); if(g.tries>=3){ g.done=true; addMark(8); } }
  drawFish();
}
function fishStop(){ BG.done=true; addMark(8); drawFish(); }

function takeTea(){

}
function useItem(id){
  const p=SHOP.find(x=>x.id===id);
  if(!(S.inv[id]>0)) return;

  if(p.type==="san"){ S.sn=Math.min(100,S.sn+p.v); toast(`이성 +${p.v}`,"good"); }
  if(p.type==="ward"){ S.ward=true; toast("호신 부적을 붙였습니다. 다음 의뢰의 피해가 절반이 됩니다.","good"); }

    const ex=S.buffs.find(b=>b.n===p.n);

}

function addFriend(n){
  if(!n){ toast("이름을 입력하거나 학생 명부에서 골라 주세요.","bad"); return; }
  if(S.friends.find(f=>f.n===n)){ toast("이미 인연을 맺은 학생입니다."); return; }
  S.friends.push({n, c:rnd(1,7), lv:rnd(20,90), line:pick(["장인","마무기"]), last:cal().str});
  toast(`${n} 학생과 인연을 맺었습니다.`,"good"); renderMain(); save();
}
function relPropose(name, idx){
  const cur=idx!=null?S.rel[idx]:null;
  modal("관계 "+(cur?"수정 제안":"신청"),`
    <div class="tiny muted" style="margin-bottom:10px">${esc(name)}</div>
    <div class="row" style="margin-bottom:10px">
      ${RELKIND.map(k=>`<button class="btn sm" onclick="relSet('${k}')">${k}</button>`).join("")}</div>

    <label class="f">${esc(name)} 님은 나의</label><input class="inp" id="rb" maxlength="8" value="${cur?esc(cur.b):"친구"}">
    <div class="tiny muted" style="margin-top:8px">관계 이름·애칭은 8자까지 가능합니다. 한 학생과는 하나의 관계만 맺을 수 있습니다.</div>
    <div class="row" style="margin-top:14px">
      <button class="btn pri" onclick="relSave('${esc(name)}',${idx==null?"null":idx})">${cur?"수정 제안 보내기":"관계 신청"}</button>
      <button class="btn" onclick="closeModal()">취소</button></div>`);
}
function relSet(k){ const m={"선배·후배":["선배","후배"],"후배·선배":["후배","선배"],"스승·제자":["스승","제자"],"제자·스승":["제자","스승"]};
  const p=m[k]||[k,k]; $("#ra").value=p[0]; $("#rb").value=p[1]; }
function relSave(n, idx){
  const a=$("#ra").value.trim()||"친구", b=$("#rb").value.trim()||"친구", nick=$("#rn").value.trim();
  if(idx!=null&&idx>=0) S.rel[idx]={n,a,b,nick};
  else { if(S.rel.find(r=>r.n===n)){ toast("이미 맺은 관계가 있습니다.","bad"); return; } S.rel.push({n,a,b,nick}); }
  if(!S.friends.find(f=>f.n===n)) addFriend(n);
  closeModal(); renderMain(); toast(`${n} 님과의 관계를 적어 두었습니다.`,"good"); save();
}
function relCut(i){ if(confirm("관계를 끊을까요?")){ S.rel.splice(i,1); renderMain(); save(); } }

function exportSave(){
  const txt=JSON.stringify(S);
  try{
    navigator.clipboard.writeText(txt).then(
      ()=>toast("기록을 클립보드에 복사했습니다. 메모장에 붙여 두면 보관할 수 있습니다.","good"),
      ()=>showSaveText(txt));
  }catch(e){ showSaveText(txt); }
}
function showSaveText(txt){
  modal("기록 내보내기",`<div class="tiny muted" style="margin-bottom:8px">아래 글자를 모두 선택해 복사해 두세요.</div>

}

let MK=null;

          <div class="seg">${["근거리","원거리"].map(t=>`<button class="${MK.combatStyle===t?"on":""}" onclick="MK.combatStyle='${t}';drawCreate()">${t}</button>`).join("")}</div>

          <label class="f">두상</label>
          <div class="row" style="margin-bottom:6px;align-items:center">
            ${MK.avImg?`<div style="width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid ${MK.color};flex:none"><img src="${MK.avImg}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`:""}
            <button class="btn sm" onclick="openAvatar(true)">이미지 선택</button>
            ${MK.avImg?`<button class="btn sm" onclick="MK.avImg=null;drawCreate()">제거</button>`:""}
          </div>

function mkCheck(){

  const h=$("#c_hint"); if(h) h.textContent=ok?"문밖에 그 아이가 기다리고 있을 것이다.":"이름을 적고 스탯 총합을 13으로 맞춰 주세요.";
}
function mkSt(k,d){
  const v=MK.st[k]+d; if(v<1||v>5) return;
  MK.st[k]=v; drawCreate();
}
function finishCreate(){
  S=newState();
  S.made=true; S.name=MK.name.trim(); S.line=MK.line; S.weapon=MK.weapon.trim();
  S.combatStyle=MK.combatStyle||"근거리";
  S.hall=MK.hall; S.color=MK.color; S.av=MK.av; S.avImg=MK.avImg||null; S.intro=MK.intro.trim();

  addMsg("전체","강시",fmtChat("통금은 오전 2시다. 늦으면 정말로 문을 잠근다."),NPC.강시.c,"경비");
  boot();

}

      </div>
      <div style="flex:1;min-width:180px">
        <button class="btn pri" onclick="document.getElementById('avfile').click()">그림 고르기</button>
        <label class="f">크기</label>
        <input type="range" id="avzoom" min="100" max="400" value="${Math.round(a.zoom*100)}"
          style="width:100%" ${a.img?"":"disabled"}>
        <div class="tiny muted">확대 ${Math.round(a.zoom*100)}% · 그림 위를 끌어 옮길 수 있습니다</div>
        <div class="row" style="margin-top:10px">
          <button class="btn sm" ${a.img?"":"disabled"} onclick="avReset()">가운데로</button>
        </div>
        <hr class="hr">
        <div class="tiny muted">${a.img?`원본 ${a.img.naturalWidth}×${a.img.naturalHeight}px → 저장 100×100px`:"아직 그림이 없습니다"}</div>
        <div class="row" style="margin-top:14px">
          <button class="btn pri" ${a.img?"":"disabled"} onclick="avApplySave()">적용</button>
          <button class="btn" onclick="closeModal()">취소</button>
        </div>
      </div>
    </div>`, "wide");
  avBind();
}
function avBind(){
  const a=AV;
  const f=document.getElementById("avfile");
  if(f) f.onchange=e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    if(file.size>12*1024*1024){ toast("그림이 너무 큽니다. 12MB 이하로 올려 주세요.","bad"); return; }
    const rd=new FileReader();
    rd.onload=()=>{
      const im=new Image();
      im.onload=()=>{ a.img=im; a.zoom=1; a.ox=0; a.oy=0; drawAvatarUI(); };
      im.onerror=()=>toast("그림을 읽지 못했습니다.","bad");
      im.src=rd.result;
    };
    rd.onerror=()=>toast("파일을 읽지 못했습니다.","bad");
    rd.readAsDataURL(file);
  };
  const z=document.getElementById("avzoom");
  if(z) z.oninput=e=>{ a.zoom=(+e.target.value)/100; avLayout();
    const t=z.parentElement.querySelector(".tiny.muted");
    if(t) t.textContent=`확대 ${Math.round(a.zoom*100)}% · 그림 위를 끌어 옮길 수 있습니다`; };
  const box=document.getElementById("avbox");
  if(box&&a.img){
    let sx=0, sy=0, bx=0, by=0, on=false;
    box.onpointerdown=e=>{ on=true; sx=e.clientX; sy=e.clientY; bx=a.ox; by=a.oy;
      box.setPointerCapture(e.pointerId); box.style.cursor="grabbing"; };
    box.onpointermove=e=>{ if(!on) return; a.ox=bx+(e.clientX-sx); a.oy=by+(e.clientY-sy); avLayout(); };
    box.onpointerup=box.onpointercancel=e=>{ on=false; box.style.cursor="grab"; };
    box.onwheel=e=>{ e.preventDefault();
      a.zoom=clamp(a.zoom*(e.deltaY<0?1.08:1/1.08),1,4); avLayout();
      const zz=document.getElementById("avzoom"); if(zz) zz.value=Math.round(a.zoom*100); };
    avLayout();
  }
}
function avLayout(){
  const a=AV, el=document.getElementById("avimg"); if(!el||!a.img) return;
  const nw=a.img.naturalWidth, nh=a.img.naturalHeight;
  const base=Math.max(a.F/nw, a.F/nh), sc=base*a.zoom;
  const w=nw*sc, h=nh*sc;
  let x=(a.F-w)/2+a.ox, y=(a.F-h)/2+a.oy;
  x=clamp(x, a.F-w, 0); y=clamp(y, a.F-h, 0);
  a.ox=x-(a.F-w)/2; a.oy=y-(a.F-h)/2;
  a.x=x; a.y=y; a.w=w; a.h=h;
  el.style.width=w+"px"; el.style.height=h+"px"; el.style.left=x+"px"; el.style.top=y+"px";
}
function avReset(){ AV.ox=0; AV.oy=0; AV.zoom=1; avLayout();
  const z=document.getElementById("avzoom"); if(z) z.value=100; }
function avApplySave(){
  const a=AV; if(!a.img) return;
  avLayout();
  const R=100/a.F;
  const c=document.createElement("canvas"); c.width=100; c.height=100;
  const g=c.getContext("2d");
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high";
  g.drawImage(a.img, a.x*R, a.y*R, a.w*R, a.h*R);   // 배경은 칠하지 않아 투명 PNG가 유지됩니다
  let url;
  try{ url=c.toDataURL("image/png"); }
  catch(e){ toast("그림을 저장하지 못했습니다.","bad"); return; }
  if(a.forCreate){ MK.avImg=url; closeModal(); drawCreate(); toast("두상을 설정했습니다."); return; }
  S.avImg=url;
  closeModal(); renderTop(); renderNav(); renderMain(); drawMe(); save();
  toast("두상을 저장했습니다. 100×100으로 줄여 보관합니다.","good");
}
